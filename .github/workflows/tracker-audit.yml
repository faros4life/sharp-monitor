name: tracker-audit

# On demand: read-only tracker audit (duplicates, scores). Private email; counts-only log. Nov 6.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "audit = duplicate/score audit. record = bot-only W-L-P, P&L, ROI and open bets (both read-only; dollars by private email, counts in this log)."
        default: "audit"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Tracker audit (private email)
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
        run: |
          if [ "${{ inputs.mode }}" = "record" ]; then
            python -u bot_record.py
          else
            python -u tracker_audit.py
          fi
