name: board-clv-check

# ONE TARGETED CHECK (Peter, 2026-11-09): the verified standardized Pinnacle CLV of the exact
# graded BETS BOARD PLAYS calls, and whether a resting price was obtainable at the decision time.
#
# Read-only and manual only. contents: read, no commit step, no state file written, no bet, no
# order, no switch. Spends NO OddsPapi credits: Pinnacle closes come from the already-bought
# history cache, /historical-odds is free and bypasses the credit gate, and any paid lookup the
# gate refuses degrades to "no verified close" instead of buying.
#
# Prints units and percentages only - no dollars, stakes, balances or account data - so it is safe
# in a public Actions log.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clv-ledger
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      # MY BUG, 9 Nov: the first version of this workflow omitted this step, so the run started
      # with an empty hcache and reported 0 of 54 verified closes. I read that as evidence the
      # history cache never persists and told Peter so; it was my own omission. Every other
      # history-reading workflow restores the shared cache first - this one now does too.
      - name: Restore shared OddsPapi history cache (read only)
        uses: actions/cache/restore@v4
        with:
          path: hcache
          key: hcache-${{ github.run_id }}
          restore-keys: hcache-
      - name: BETS BOARD PLAYS CLV and obtainability (read-only, 0 credits)
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          ODDSPAPI_FREE_KEY: ${{ secrets.ODDSPAPI_FREE_KEY }}
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
        run: python -u board_clv_check.py
      # Nov 10: the rejected-vs-accepted Lane 1 audit runs HERE, not in rest-depth-report, because
      # this job already restores the hcache and holds TRACKER_PASSPHRASE - without both, the
      # Pinnacle CLV column cannot compute at all, which is what blocked two earlier attempts.
      # Read-only, cached data only, 0 paid credits. This workflow is dispatch-only, so adding a
      # step creates no recurring report and no extra email (the audit prints; it does not send).
      - name: Rejected-vs-accepted Lane 1 audit (read-only, 0 credits)
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          ODDSPAPI_FREE_KEY: ${{ secrets.ODDSPAPI_FREE_KEY }}
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DEPTH_DAYS: "10"
        run: python -u rest_depth_report.py
