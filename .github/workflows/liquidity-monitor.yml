name: liquidity-monitor

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min: a full run takes ~4.5 min
  workflow_dispatch:

concurrency:
  group: liquidity-monitor
  cancel-in-progress: false   # queue runs, never two at once

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Kalshi books
        env:
          LIQ_PRIMARY_MIN: ${{ vars.LIQ_PRIMARY_MIN }}
          LIQ_SECOND_MIN: ${{ vars.LIQ_SECOND_MIN }}
          LIQ_LEAGUES: ${{ vars.LIQ_LEAGUES }}
          LIQ_NTFY_TOPIC: ${{ vars.LIQ_NTFY_TOPIC }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # read-only sportsbook prices at alert time (Hard Rock etc.)
        run: python -u liquidity_monitor.py
      - name: Commit state and alerts
        if: always()
        run: |
          if [ -n "$(git status --porcelain liquidity)" ]; then
            git config user.name "liquidity-monitor"
            git config user.email "liquidity-monitor@users.noreply.github.com"
            git pull --rebase --autostash -q   # pick up the sharp-monitor's commits first
            git add liquidity
            git commit -m "Update liquidity alerts"
            for i in 1 2 3; do
              git pull --rebase -q && git push && break
              sleep 5
            done
          fi
