name: liquidity-monitor

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min: a full run takes ~4.5 min
  workflow_dispatch:

concurrency:
  group: liquidity-monitor
  cancel-in-progress: false   # queue runs, never two at once

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Kalshi books
        env:
          LIQ_PRIMARY_MIN: ${{ vars.LIQ_PRIMARY_MIN }}
          LIQ_SECOND_MIN: ${{ vars.LIQ_SECOND_MIN }}
          LIQ_LEAGUES: "NFL,NCAAF,NBA,NHL"   # MLB, NCAAB, tennis run separately (liquidity-extra)
          LIQ_NTFY_TOPIC: ${{ vars.LIQ_NTFY_TOPIC }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # read-only sportsbook prices at alert time (Hard Rock etc.)
          PROPHETX_ACCESS_KEY: ${{ secrets.PROPHETX_ACCESS_KEY }}   # read-only: login + markets, never orders
          PROPHETX_SECRET_KEY: ${{ secrets.PROPHETX_SECRET_KEY }}
        run: python -u liquidity_monitor.py
      - name: Commit state and alerts
        if: always()
        run: |
          # Save our files over whatever is upstream (only this workflow writes liquidity/), never a merge:
          # a merge here once wrote conflict markers into state.json.
          if [ -n "$(git status --porcelain liquidity)" ]; then
            git config user.name "liquidity-monitor"
            git config user.email "liquidity-monitor@users.noreply.github.com"
            rm -rf "$RUNNER_TEMP/out" && mkdir -p "$RUNNER_TEMP/out" && cp -r liquidity "$RUNNER_TEMP/out/"
            for i in 1 2 3 4 5; do
              git fetch -q origin main && git reset -q --hard origin/main
              rm -rf liquidity && cp -r "$RUNNER_TEMP/out/liquidity" .
              git add -A liquidity
              git diff --cached --quiet && break
              git commit -q -m "Update liquidity alerts"
              git push -q origin HEAD:main && break
              sleep 5
            done
          fi
