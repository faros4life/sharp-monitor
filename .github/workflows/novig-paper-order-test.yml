name: novig-paper-order-test

on:
  workflow_dispatch:   # manual: ONE ~$1 fill-or-kill order on the Novig PAPER exchange (refuses to run anywhere else)

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Novig paper order test (play money)
        env:
          NOVIG_HOST: "https://api.paper.novig.com"
          NOVIG_PAPER_TRADE_KEY_ID: ${{ secrets.NOVIG_PAPER_TRADE_KEY_ID }}
          NOVIG_PAPER_TRADE_KEY_PEM: ${{ secrets.NOVIG_PAPER_TRADE_KEY_PEM }}
        run: |
          python -u novig_paper_order_test.py 2>&1 | tee out.txt
          { echo '```'; cat out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
