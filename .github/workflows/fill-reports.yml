name: fill-reports

# Kalshi resting-fill reporting, split out of executor-dry-run (Peter, Nov 12).
#
# It was 518.8s of a 632-second executor pass and gates nothing, so it was holding the executor
# open past the 12-minute registry freshness window - which is what made AGAINST YOUR BET
# unavailable. See fill_reports_run.py for the full chain.
#
# Novig reporting deliberately STAYS in the executor: 16.8s, and it carries the put_venue_ids()
# venue reconciliation.

on:
  # Nov 12 (Peter, "lets fix fill reports"). MEASURED: this workflow declares the 15-minute cron
  # below and has NEVER run on it - four runs, all workflow_dispatch, none since 19:45 - so Kalshi
  # resting-fill reporting simply stopped when it was split out of the executor. Minutes 3, 18, 33
  # and 48 all passed without firing.
  #
  # GitHub's scheduler is not broken here: bets-board ran on schedule at 20:47:50Z and succeeded.
  # It is UNRELIABLE here. Of the last 100 runs in this repo, 87 are workflow_dispatch (cron-job.org
  # is the real timer, as executor-dry-run's own comment says) and only 5 are schedule - GitHub
  # drops scheduled events under that kind of load. The repo already treats its crons as backup
  # timers for exactly this reason; this one had no primary.
  #
  # So it now follows the executor, which runs every ~5 minutes and reliably. workflow_run fires
  # whatever triggered the upstream run, so a cron-job.org dispatch of the executor carries this
  # along with it. The 15-minute cron stays as the backup it always was.
  #
  # Firing more often than every 15 minutes is safe BY ITS OWN DESIGN: the concurrency group below
  # is cancel-in-progress: false, so a firing while one is already running is DROPPED rather than
  # queued - never two at once, which its comment calls the only way this could double-notify. The
  # reporter also dedupes on its own token emails, so a dropped firing loses nothing.
  workflow_run:
    workflows: ["executor-dry-run"]
    types: [completed]
  schedule:
    - cron: "3-59/15 * * * *"   # backup timer; the executor above is the real one
  workflow_dispatch:
    inputs:
      mode:
        description: "report = the usual Kalshi fill reporting. reconcile = one READ-ONLY historical check of stored Kalshi order ids against the venue (places nothing, reports nothing to Peter)."
        default: "report"

concurrency:
  group: fill-reports
  cancel-in-progress: false   # never two at once: that is the only way this could double-notify

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # Under the 15-minute schedule, so a slow run cannot still be going when the next one fires.
    # The reporter is resumable by design - it dedupes on its own token emails - so a run cut off
    # here reports next firing rather than losing anything.
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Kalshi resting-fill reports (counts only in this log)
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}               # reads the order's fill state (GET)
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}     # the fill text itself
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Read for the stored ledger rows, written for the notification claim and the
          # "reported" token - exactly the writes this reporter already made inside the executor.
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          if [ "${{ inputs.mode }}" = "reconcile" ]; then
            python -u kalshi_reconcile.py
          else
            python -u fill_reports_run.py
          fi
