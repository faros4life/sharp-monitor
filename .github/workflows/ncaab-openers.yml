name: ncaab-openers

# PAPER ONLY (item 28; Muse registered Nov 2, Peter yes Nov 3): NCAAB openers freezer. Never places orders, never
# alerts, never writes main: data lives on the ncaab-openers branch. Reads ESPN (public, free) only. Counts-only log.
on:
  # PAUSED Nov 9 (Peter, credit stretch) until the Dec 4 OddsPapi reset. ~17 billable credits a
  # day, the second largest consumer, and NCAAB is not in LANE 1 scope - it cannot affect a live
  # decision before the reset. Paused rather than halved on purpose: openers are time-sensitive,
  # so a half-rate capture would miss the actual open and degrade the data for little saving.
  # Restore by uncommenting. workflow_dispatch still works for a manual run.
  # schedule:
  #   - cron: "19,49 * * * *"
  workflow_dispatch:

concurrency:
  group: ncaab-openers
  cancel-in-progress: false

permissions:
  contents: write
  actions: read   # Nov 3: the grader waits while another OddsPapi download job is running

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # the first run builds last season's prior from ESPN box scores (one time)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load lane data
        run: |
          mkdir -p ncaab-openers
          if git fetch -q origin ncaab-openers 2>/dev/null; then
            git show origin/ncaab-openers:ncaab_openers.json > ncaab-openers/ncaab_openers.json 2>/dev/null || rm -f ncaab-openers/ncaab_openers.json
            git show origin/ncaab-openers:ncaab_prior.json > ncaab-openers/ncaab_prior.json 2>/dev/null || rm -f ncaab-openers/ncaab_prior.json
            git show origin/ncaab-openers:ncaab_grades.enc > ncaab-openers/ncaab_grades.enc 2>/dev/null || rm -f ncaab-openers/ncaab_grades.enc
          fi
      - name: Freeze numbers (paper)
        run: python -u ncaab_openers.py
      - run: pip install -q cryptography
      - name: Grade frozen numbers v1.1 (paper; OddsPapi free history; encrypted grades; private email; counts only)
        continue-on-error: true   # a grader failure never stops the freezer's save
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          ODDSPAPI_FREE_KEY: ${{ secrets.ODDSPAPI_FREE_KEY }}   # Nov 3: history goes through the free key (paid key: 403 on pinnacle)
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u ncaab_grade.py
      - name: Save to the ncaab-openers branch (never main)
        if: always()
        run: |
          [ -f ncaab-openers/ncaab_openers.json ] || exit 0
          rm -rf "$RUNNER_TEMP/out" && mkdir -p "$RUNNER_TEMP/out" && cp ncaab-openers/* "$RUNNER_TEMP/out/"
          git config user.name "ncaab-openers"
          git config user.email "ncaab-openers@users.noreply.github.com"
          for i in 1 2 3; do
            if git fetch -q origin ncaab-openers 2>/dev/null; then
              git checkout -q -f -B ncaab-openers origin/ncaab-openers
            else
              git checkout -q -f --orphan ncaab-openers
              git rm -rq --cached . >/dev/null 2>&1 || true
            fi
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp "$RUNNER_TEMP/out/"* .
            git add -A
            git diff --cached --quiet && break
            git commit -q -m "NCAAB openers update"
            git push -q origin ncaab-openers && break
            sleep 5
          done
