name: clv-basis-audit

# READ-ONLY audit (Peter Nov 5): separates VERIFIED same-line CLV from MODELED (line-converted) CLV, and reports the
# Lane 1 kill-switch average on each basis. Writes no state, commits nothing, places nothing, changes no rule or
# threshold. Reads the encrypted CLV ledger in place. Private email; the log prints counts only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: CLV basis audit (private email, read-only)
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
        run: python -u clv_basis_audit.py
