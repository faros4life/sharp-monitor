name: sharp-monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # backup; cron-job.org is the real 5-minute timer
  workflow_dispatch:          # used by cron-job.org and the "Run workflow" button

concurrency: sharp-monitor

permissions:
  contents: write
  actions: write     # lets this run start the executor right after a new alert

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: sharp-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sharp-state-
      - name: Check lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SPORTS: ${{ vars.SPORTS }}
          RETAIL_BOOKS: ${{ vars.RETAIL_BOOKS }}
          SHARP_BOOK: ${{ vars.SHARP_BOOK }}
          MAX_JUICE: ${{ vars.MAX_JUICE }}
          NCAAF_TOP25: ${{ vars.NCAAF_TOP25 }}
          RECAP_REPLAY_HOURS: ${{ vars.RECAP_REPLAY_HOURS }}
          LATE_MINUTES: ${{ vars.LATE_MINUTES }}
          LATE_MODE: ${{ vars.LATE_MODE }}
          ACTIVE_START_ET: "6"
        run: python sharp_monitor.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: sharp-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Paper splits (units only; splits.json + SPLITS.md)
        if: always()
        run: python splits.py || echo "splits failed (record unchanged)"
      - name: Publish alerts.json
        if: always()
        run: |
          if [ -n "$(git status --porcelain alerts.json splits.json SPLITS.md)" ]; then
            git config user.name "sharp-monitor"
            git config user.email "sharp-monitor@users.noreply.github.com"
            git add alerts.json splits.json SPLITS.md 2>/dev/null || git add alerts.json
            git commit -m "Update alerts.json"
            git pull --rebase -q || true
            git push || true
          fi
      - name: Wake the executor (new alert sent)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f wake_executor ]; then
            gh workflow run executor-dry-run.yml --ref main || echo "executor wake failed (its timer will pick it up)"
          fi
