name: sharp-monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # backup; cron-job.org is the real 5-minute timer
  workflow_dispatch:          # used by cron-job.org and the "Run workflow" button

concurrency: sharp-monitor

permissions:
  contents: write
  actions: write     # lets this run start the executor right after a new alert

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: sharp-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sharp-state-
      - name: Check lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # Oct 27: every ntfy push mirrored to Telegram
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SPORTS: ${{ vars.SPORTS }}
          RETAIL_BOOKS: ${{ vars.RETAIL_BOOKS }}
          CONFIRM_BOOK: ${{ vars.CONFIRM_BOOK }}
          SHARP_BOOK: ${{ vars.SHARP_BOOK }}
          MAX_JUICE: ${{ vars.MAX_JUICE }}
          NCAAF_TOP25: ${{ vars.NCAAF_TOP25 }}
          RECAP_REPLAY_HOURS: ${{ vars.RECAP_REPLAY_HOURS }}
          LATE_MINUTES: ${{ vars.LATE_MINUTES }}
          LATE_MODE: ${{ vars.LATE_MODE }}
          ACTIVE_START_ET: "6"
        run: python sharp_monitor.py
      - name: Odds screen fast refresh (Nov 5; screen only, no alerts)
        if: always()
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SPORTS: ${{ vars.SPORTS }}
          RETAIL_BOOKS: ${{ vars.RETAIL_BOOKS }}
          CONFIRM_BOOK: ${{ vars.CONFIRM_BOOK }}
          SHARP_BOOK: ${{ vars.SHARP_BOOK }}
          ODDS_SCREEN_MIN: ${{ vars.ODDS_SCREEN_MIN }}
        run: python odds_screen_poll.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: sharp-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Paper splits (units only; splits.json + SPLITS.md)
        if: always()
        run: python splits.py || echo "splits failed (record unchanged)"
      # Nov 13: THIS STEP WAS SILENTLY LOSING EVERY ALERT FOR NINE HOURS.
      #
      # MEASURED: alerts.json last landed on main at 03:35:16Z; at 12:34Z the newest alert in the
      # committed feed was still 03:30:18Z, and 15 of the last 15 sharp-monitor runs ended with
      # "! [rejected] main -> main (fetch first)". Each run scanned, built its alerts, failed to
      # push, and reported SUCCESS - because both git commands below ended in "|| true". The
      # executor reads alerts.json from the repo, so the bot was working from a nine-hour-old feed
      # and correctly found nothing new to bet. No workflow went red; nothing was alarmed.
      #
      # CAUSE, and it was self-inflicted: chaining bets-board to the executor on Nov 12 took it
      # from every 10 minutes to every ~3, and commits to main went from ~33/hour to 50-74/hour.
      # "git pull --rebase" on a DEPTH-1 checkout cannot reconcile under that contention - it is
      # the one writer here that never adopted the fetch/reset/retry loop every other publisher in
      # this repo uses, so it was the one that starved.
      #
      # The loop below is that proven pattern (bets-board, liquidity-extra, board-page): reset
      # hard to origin, lay our freshly built files back down, commit, push, retry. A hard reset
      # also makes the Nov 9 __pycache__ dance unnecessary - rewritten tracked files cannot block
      # anything, because nothing is being rebased.
      #
      # Save-over-upstream is correct here: only sharp-monitor writes these five files, and its
      # concurrency group is serial, so this run's alerts.json is always a superset of the one on
      # main. A FAILED push is now LOUD - it fails the step instead of being swallowed.
      - name: Publish alerts.json
        if: always()
        run: |
          set -o pipefail
          FILES="alerts.json splits.json SPLITS.md hrscan.json odds_screen.json"
          if [ -z "$(git status --porcelain $FILES)" ]; then
            echo "publish: nothing changed"; exit 0
          fi
          git config user.name "sharp-monitor"
          git config user.email "sharp-monitor@users.noreply.github.com"
          rm -rf "$RUNNER_TEMP/pub" && mkdir -p "$RUNNER_TEMP/pub"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$RUNNER_TEMP/pub/" || true; done
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            for f in $FILES; do [ -f "$RUNNER_TEMP/pub/$f" ] && cp "$RUNNER_TEMP/pub/$f" "$f" || true; done
            git add $FILES 2>/dev/null || git add alerts.json
            if git diff --cached --quiet; then echo "publish: already current on main"; exit 0; fi
            git commit -q -m "Update alerts.json"
            if git push -q origin HEAD:main; then
              echo "publish: pushed on attempt $i"; exit 0
            fi
            echo "publish: attempt $i lost the race, retrying"
            sleep $((i * 3))
          done
          echo "::error::alerts.json could NOT be published after 6 attempts - the feed is now stale"
          exit 1
      - name: Wake the executor (new alert sent)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f wake_executor ]; then
            gh workflow run executor-dry-run.yml --ref main || echo "executor wake failed (its timer will pick it up)"
          fi
      - name: Start due paper / measurement jobs (GitHub's own cron barely fires here)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: timeout 120 python tick.py || echo "tick skipped"
