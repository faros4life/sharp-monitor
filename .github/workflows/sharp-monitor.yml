name: sharp-monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # backup; cron-job.org is the real 5-minute timer
  workflow_dispatch:          # used by cron-job.org and the "Run workflow" button

concurrency: sharp-monitor

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: sharp-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sharp-state-
      - name: Check lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SPORTS: ${{ vars.SPORTS }}
          RETAIL_BOOKS: ${{ vars.RETAIL_BOOKS }}
          SHARP_BOOK: ${{ vars.SHARP_BOOK }}
          ACTIVE_START_ET: "6"
        run: python sharp_monitor.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: sharp-state-${{ github.run_id }}-${{ github.run_attempt }}
