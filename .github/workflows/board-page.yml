name: board-page

# Nov 11 (Peter: "We need to fix anything else"): the public Bets Board page, on its own.
#
# WHY IT IS SEPARATE. bets-board runs the private tracker, which reads every book and takes about
# EIGHT MINUTES of that job's nine-minute timeout. Building the page takes ONE SECOND. Sharing a job
# meant any drift in the tracker killed the run, and while it ran the board's other triggers queued
# and were dropped by cancel-in-progress: false - the page went 90 minutes without rebuilding on
# Nov 11 while its own build step was never the problem. Splitting them is the fix; raising the
# timeout is not, because this is on a short schedule and a longer run collides with the next firing.
#
# This job writes NOTHING to the repo (contents: read). It reads the feeds and the committed frozen
# call log and publishes the page. bets-board still owns every commit, the tracker and the alerts.
on:
  # Nov 12: was a 5-minute cron PLUS three workflow_run triggers - 20 runs an hour, rebuilding an identical page.
  # The inputs only change every 10 minutes (liquidity-monitor's own cadence), so anything faster is waste, and
  # the waste was real: 25% of all runs in the repo were being cancelled for want of a runner. One trigger, on the
  # feed that actually produces new rows, plus a 10-minute backup timer.
  workflow_run:
    workflows: ["liquidity-monitor"]
    types: [completed]
  schedule:
    - cron: "4-59/10 * * * *"
  workflow_dispatch:

concurrency:
  group: board-page
  cancel-in-progress: true   # the page is a snapshot: a newer build always supersedes an older one

permissions:
  contents: read
  actions: read     # Nov 12: the live health page reads this repo's own workflow run history
  pages: write
  id-token: write

jobs:
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the board
        env:
          # Nov 12: live_plays_card() reads ledger rows from the private store before Gmail. This
          # is the job that publishes the page every 10 minutes, so without this token
          # registry.enabled() is False HERE and the card falls back to the IMAP read that printed
          # "Ledger unreadable". Read-only: the card renders rows, it never writes.
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -u board_build.py
      - name: Private tracker page (encrypted; built and committed by bets-board)
        run: if [ -f tracker/index.html ]; then mkdir -p site/tracker && cp tracker/index.html site/tracker/index.html; else echo 'tracker page not built yet'; fi
      - name: Odds screen page
        run: mkdir -p site/odds && cp odds/index.html site/odds/index.html
      # Nov 12 (Peter: "i want to see it at alltimes is everything running"). Reads only this
      # repo's own Actions history - no venue calls, no Gmail, no registry, no orders - so it can
      # never be the thing that breaks a betting run. continue-on-error so a health page failure
      # can never stop the board from publishing.
      - name: Live health page
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Nov 12: so the Novig submissions row reports the REAL switch instead of a hardcoded
          # PAUSED. The dispatch token is passed only to be tested for PRESENCE - health_build.py
          # takes bool() of it, never prints it and never sends it anywhere, and this job makes
          # no venue or runner call of any kind.
          EXEC_NOVIG_SUBMIT: ${{ vars.EXEC_NOVIG_SUBMIT }}
          NOVIG_DISPATCH_TOKEN: ${{ secrets.NOVIG_DISPATCH_TOKEN }}
        run: python -u health_build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
