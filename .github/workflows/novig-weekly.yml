name: novig-weekly

on:
  schedule:
    - cron: "37 12 * * 1"   # Mondays ~8:37 AM ET (12:37 UTC; 7:37 AM after DST ends)
  workflow_dispatch:
    inputs:
      week_offset:
        description: "0 = last week, 1 = the week before"
        default: "0"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Email Novig weekly reconciliation (read-only; no amounts in this log)
        env:
          NOVIG_READ_KEY_ID: ${{ secrets.NOVIG_READ_KEY_ID }}
          NOVIG_READ_KEY_PEM: ${{ secrets.NOVIG_READ_KEY_PEM }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WEEK_OFFSET: ${{ github.event.inputs.week_offset || '0' }}
        run: python -u novig_weekly.py
