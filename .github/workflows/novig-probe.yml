name: novig-probe

# Manual-only, read-only, paper-only probe (Nov 6 2026). One run:
#  1. downloads Novig's Oct 29 trades.csv + markets.csv (raw files stay on the runner; never uploaded or committed)
#  2. validates sizes / headers / timestamps / maker-taker fields / market ids
#  3. counts executed trades for NBA / NFL / NCAAF, totals separately
#  4. reports whether the taker's betting direction can be identified
#  5. restores the OddsPapi history cache RESTORE-ONLY (actions/cache/restore never saves) - zero API calls
#  6. best-effort exact-game and same-line Pinnacle match
#  7. uploads ONE small aggregate summary (no raw rows; 3-day retention)
# No cron, no secrets, no live-bot changes, no OddsPapi calls.
on:
  workflow_dispatch:
    inputs:
      day:
        description: "Trade-data day (YYYY-MM-DD)"
        required: false
        type: string
        default: "2026-10-29"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download Novig files (runner temp only)
        env:
          DAY: ${{ inputs.day }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/novig"
          for f in markets trades; do
            url="https://data.novig.com/reporting/trade-data/${DAY}/${f}.csv"
            curl -fsS -m 600 -o "$RUNNER_TEMP/novig/${f}.csv" "$url" || { echo "DOWNLOAD FAILED: $url"; exit 1; }
            echo "$f.csv bytes: $(stat -c %s "$RUNNER_TEMP/novig/${f}.csv")"
          done

      - name: Restore OddsPapi history cache (restore-only, never saves)
        uses: actions/cache/restore@v4
        with:
          path: hcache
          key: hcache-restore-probe-${{ github.run_id }}
          restore-keys: hcache-

      - run: pip install -q cryptography

      - name: Analyze (market-ID overlap with our liquidity records; aggregates only; no OddsPapi key present)
        env:
          DAY: ${{ inputs.day }}
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}   # read-only decrypt of the fixture cache
        run: |
          mkdir -p summary
          python3 - <<'PY'
          import csv, os, re, json, gzip, glob, sys, collections, datetime as dt, traceback
          csv.field_size_limit(10**9)
          sys.path.insert(0, os.getcwd())
          W = os.path.join(os.environ["RUNNER_TEMP"], "novig"); DAY = os.environ["DAY"]
          out = []
          def P(*a):
              s = " ".join(str(x) for x in a); print(s); out.append(s)
          def tsp(x):
              try:
                  d = dt.datetime.fromisoformat(str(x).strip().replace("Z", "+00:00"))
                  return d if d.tzinfo else d.replace(tzinfo=dt.timezone.utc)
              except Exception: return None
          LG = ("NBA", "NFL", "NCAAF")
          with open(os.path.join(W, "trades.csv"), newline="", encoding="utf-8-sig", errors="replace") as fh:
              rows = [r for r in csv.DictReader(fh) if r["league"] in LG and r["marketType"] == "TOTAL" and r["tradeType"] == "STRAIGHT"]
          P(f"STRICT filter marketType==TOTAL, STRAIGHT, NBA/NFL/NCAAF: {len(rows)} rows")
          mlg = {}; mouts = collections.defaultdict(set)
          for r in rows: mlg[r["marketId"]] = r["league"]; mouts[r["marketId"]].add(r["outcomeId"])
          groups = collections.defaultdict(list)           # unique executions = (timestamp, marketId) taker groups
          for r in rows:
              if r["side"] == "TAKER": groups[(r["timestamp"], r["marketId"])].append(r)
          P(f"unique totals markets {len(mlg)} | taker rows {sum(len(v) for v in groups.values())} | unique taker groups {len(groups)}")
          P("per league (markets / taker groups):", {lg: (sum(1 for m in mlg.values() if m == lg), sum(1 for k in groups if mlg[k[1]] == lg)) for lg in LG})

          # ---- our liquidity records
          UU = r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
          files = [f for f in glob.glob("liquidity/*.json") + glob.glob("liquidity-extra/*.json") + ["books/novig-books.json", "board/calls.json", "lanes/lanes.json"] if os.path.exists(f)]
          idsfile = {}
          for f in files:
              idsfile[f] = set(re.findall(UU, open(f).read()))
          allids = set().union(*idsfile.values())
          P("\n## ID OVERLAP (any UUID in our files vs Oct 29 totals market ids)")
          for f, ids in idsfile.items():
              o = len(ids & set(mlg))
              if ids: P(f"{f}: {len(ids)} uuids, overlap with totals marketIds {o}")
          recs = []
          for f in ("liquidity/alerts.json", "liquidity/moves.json", "liquidity-extra/alerts.json", "liquidity-extra/moves.json"):
              try:
                  d = json.load(open(f)); recs += d.get("alerts") or d.get("moves") or []
              except Exception: pass
          meta = collections.defaultdict(list); omap = collections.defaultdict(set)
          for rec in recs:
              txt = json.dumps(rec)
              mids = re.findall(r'market_id\\*": \\*"(' + UU + ')', txt); oids = re.findall(r'outcome_id\\*": \\*"(' + UU + ')', txt)
              for i, m in enumerate(mids):
                  meta[m].append(rec)
                  lab = str(rec.get("side") or "") + " " + str(rec.get("side_label") or "")
                  lm = re.search(r"\b(over|under)\b", lab, re.I)
                  if lm and i < len(oids): omap[(m, oids[i])].add(lm.group(1).upper())
          ov = {m for m in mlg if m in allids}; ovm = {m for m in mlg if m in meta}
          tg = lambda S, lg: sum(1 for k in groups if k[1] in S and mlg[k[1]] == lg)
          P(f"records scanned (alerts+moves, both dirs): {len(recs)} | Novig market ids with a game/line record: {len(meta)}")
          fld = collections.Counter()
          for m in ovm:
              r = meta[m][0]
              for k in ("game", "line", "start_utc", "teams", "side", "side_label"): fld[k] += r.get(k) not in (None, "", [])
          P(f"fields present on overlapping markets (n={len(ovm)}):", dict(fld))
          P("\n| league | totals markets | id in any file | id with game/line record | trade groups | groups covered (any file) | groups covered (record) |"); P("|---|---|---|---|---|---|---|")
          for lg in LG:
              M = {m for m, l in mlg.items() if l == lg}; n = sum(1 for k in groups if mlg[k[1]] == lg)
              P(f"| {lg} | {len(M)} | {len(M & ov)} | {len(M & ovm)} | {n} | {tg(ov, lg)} ({100*tg(ov, lg)/max(n,1):.1f}%) | {tg(ovm, lg)} ({100*tg(ovm, lg)/max(n,1):.1f}%) |")
          if not ovm:
              P("\nNO market with a game/line record -> STOP: no reliable mapping exists. No further funnel run.")
              open("summary/summary.md", "w").write("\n".join(out) + "\n"); sys.exit(0)

          # ---- funnel: fixtures, same line, direction, horizons
          P("\n## FUNNEL")
          try:
              import clv_ledger as cl
              st = cl.tb.dec(json.load(open(cl.STATE))); fx = st.get("fixtures") or {}
              mkmap = json.load(open("clv/markets.json"))["m"]
              lo = dt.datetime.fromisoformat(DAY).replace(tzinfo=dt.timezone.utc); hi = lo + dt.timedelta(hours=34)
              cand = {fid: f for fid, f in fx.items() if f.get("lg") in LG and (tsp(f.get("start")) or lo) >= lo and (tsp(f.get("start")) or lo) <= hi}
              havep = {fid for fid in cand if os.path.exists(f"hcache/{fid}__pinnacle.json.gz")}
              P(f"fixtures in window {len(cand)} | with pinnacle file {len(havep)}")
              sq = lambda s: re.sub(r"[^A-Z0-9]", "", s.upper())
              def toks(f, n, p):
                  w = f.get(n, "").split(); ab = (f.get(p, "").split() or [""])[-1]
                  return {t for t in {sq(ab) if ab.isupper() else "", sq(w[-1]) if w else "", sq(" ".join(w[:-1]))} if len(t) >= 3}
              ftok = {fid: (toks(f, "n1", "p1"), toks(f, "n2", "p2")) for fid, f in cand.items()}
              info = {}
              for m in ovm:
                  recs_m = [r for r in meta[m] if r.get("line") is not None]
                  r0 = recs_m[0] if recs_m else meta[m][0]
                  lines = {r.get("line") for r in recs_m}
                  t = sq(str(r0.get("game", "")) + str(r0.get("teams", ""))); s0 = tsp(r0.get("start_utc"))
                  hits = [fid for fid, f in cand.items() if f["lg"] == mlg[m] and s0 and abs((tsp(f["start"]) - s0).total_seconds()) <= 2700
                          and any(a in t for a in ftok[fid][0]) and any(b in t for b in ftok[fid][1])]
                  lab = {o: omap.get((m, o)) for o in mouts[m]}
                  known = {o: next(iter(v)) for o, v in lab.items() if v and len(v) == 1}
                  if len(mouts[m]) == 2 and len(known) == 1:
                      o1 = next(iter(known)); o2 = next(o for o in mouts[m] if o != o1)
                      known[o2] = "UNDER" if known[o1] == "OVER" else "OVER"
                  info[m] = dict(lg=mlg[m], line=(next(iter(lines)) if len(lines) == 1 else None), fid=(hits[0] if len(hits) == 1 else None),
                                 ambiguous=len(hits) > 1, dirmap=known, start=s0)
              hc = {}
              def pin(fid):
                  if fid not in hc:
                      try: hc[fid] = cl.book_markets(json.load(gzip.open(f"hcache/{fid}__pinnacle.json.gz", "rt")), "pinnacle")
                      except Exception: hc[fid] = None
                  return hc[fid]
              def pline(fid, line):
                  for mid in (pin(fid) or {}):
                      mm = mkmap.get(str(mid))
                      if mm and mm[1] == "totals" and abs(mm[2] - float(line)) < 1e-9: return mid, mm
                  return None
              H = (15, 30, 60); mc = {lg: collections.Counter() for lg in LG}; gc = {lg: collections.Counter() for lg in LG}
              for m, i in info.items():
                  c = mc[i["lg"]]; c["markets with record"] += 1
                  c["line single-valued"] += i["line"] is not None; c["outcome mapped"] += bool(i["dirmap"])
                  c["game->fixture"] += bool(i["fid"]); c["ambiguous"] += i["ambiguous"]
                  c["+pinnacle file"] += bool(i["fid"] and i["fid"] in havep)
                  c["+exact same line"] += bool(i["fid"] in havep and i["line"] is not None and pline(i["fid"], i["line"]))
              for (ts, m), tk in groups.items():
                  if m not in info: continue
                  i = info[m]; c = gc[i["lg"]]; c["groups with record"] += 1
                  outs = {r["outcomeId"] for r in tk}
                  if len(outs) != 1: c["mixed-outcome groups (dropped)"] += 1; continue
                  d = i["dirmap"].get(next(iter(outs)))
                  if not d: continue
                  c["direction known"] += 1
                  if not (i["fid"] and i["fid"] in havep and i["line"] is not None): continue
                  pl = pline(i["fid"], i["line"])
                  if not pl: continue
                  c["+same-line pinnacle"] += 1
                  t = tsp(ts); s = tsp(cand[i["fid"]]["start"]); mid, mm = pl
                  oid = next((k for k, v in mm[3].items() if v == "Over"), None)
                  ticks = (((pin(i["fid"]).get(str(mid)) or {}).get("outcomes") or {}).get(oid) or {}).get("players", {}).get("0") if oid else None
                  b0 = cl.last_tick(ticks, t) if ticks and t else None
                  if not b0 or t >= s: continue
                  c["+pregame, pinnacle tick at trade"] += 1
                  for h in H:
                      th = t + dt.timedelta(minutes=h)
                      if th >= s: continue
                      b1 = cl.last_tick(ticks, th)
                      if b1:
                          c[f"{h}m usable"] += 1; c[f"{h}m moved"] += (b1[1].get("price") != b0[1].get("price"))
              P("MARKETS:", {lg: dict(mc[lg]) for lg in LG})
              P("TRADE GROUPS (unique taker executions):", {lg: dict(gc[lg]) for lg in LG})
              P(f"TOTAL usable groups: any-horizon " + str({h: sum(gc[lg][f'{h}m usable'] for lg in LG) for h in H}))
          except Exception:
              P("FUNNEL FAILED:", traceback.format_exc()[-800:])
          open("summary/summary.md", "w").write("\n".join(out) + "\n")
          PY

      - name: Upload summary only (no raw trade files)
        uses: actions/upload-artifact@v4
        with:
          name: novig-probe-summary
          path: summary/summary.md
          retention-days: 3
