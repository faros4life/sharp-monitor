name: nba-backtest2

# On demand: NBA totals model backtest #2 (HYPOTHESIS): bias fix, open timing, Novig price. ESPN box scores (public) + Pinnacle from OddsPapi free
# history (one billable /fixtures call). Private email; the log prints counts only. Reads only; writes nothing.
on:
  workflow_dispatch:
    inputs:
      bt_from: {required: false, type: string, default: "2026-10-21"}
      bt_to: {required: false, type: string, default: ""}

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # GitHub maximum (Peter: no hard limit)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Restore shared OddsPapi history cache (private Actions cache, never committed)
        uses: actions/cache/restore@v4   # Nov 3: restore-only (a saved 6 GB copy per run filled the 10 GB limit)
        with:
          path: hcache
          key: hcache-${{ github.run_id }}
          restore-keys: hcache-
      - name: NBA model backtest 2 (private email)
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          # Nov 6: required by the script's fixture-cache reuse; without it /fixtures is re-bought.
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
          ODDSPAPI_FREE_KEY: ${{ secrets.ODDSPAPI_FREE_KEY }}   # Nov 3: history goes through the free key (paid key: 403 on pinnacle)
          BT_FROM: ${{ inputs.bt_from }}
          BT_TO: ${{ inputs.bt_to }}
        run: python -u nba_backtest2.py
