name: plimit-level

# Item 56 (Nov 3): Pinnacle limit LEVEL as a weight on sharp alerts. Paper / measurement only. Reads the shared OddsPapi
# history cache only (restore-only, no new cache copy; cache_only=1 = no downloads). Private email; counts-only log.
on:
  workflow_dispatch:
    inputs:
      cache_only: {required: false, type: string, default: "1"}

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Restore shared OddsPapi history cache (read only)
        uses: actions/cache/restore@v4
        with:
          path: hcache
          key: hcache-${{ github.run_id }}
          restore-keys: hcache-
      - name: Item 56 P-limit level (private email)
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          ODDSPAPI_FREE_KEY: ${{ secrets.ODDSPAPI_FREE_KEY }}   # Nov 3: history goes through the free key (paid key: 403 on pinnacle)
          # Nov 6: WITHOUT this the cache-reuse added to plimit_level.py cannot decrypt
          # clv/state.enc, silently falls through to "will fetch", and buys one /fixtures call per
          # league. That is exactly what happened on the 12:33Z run: 5 billable calls Peter had not
          # approved. contents: read, never commits, and plimit_level never saves that state.
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
          PLEVEL_CACHE_ONLY: ${{ inputs.cache_only }}
        run: python -u plimit_level.py
