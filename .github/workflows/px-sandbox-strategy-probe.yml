name: px-sandbox-strategy-probe

on:
  workflow_dispatch:   # manual: order-type probe on the ProphetX SANDBOX (refuses to run anywhere else)

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sandbox order-type probe (practice money)
        env:
          PX_BASE: "https://api.sandbox.prophetx.dev/partner"
          PROPHETX_ACCESS_KEY: ${{ secrets.PX_SANDBOX_ACCESS_KEY }}
          PROPHETX_SECRET_KEY: ${{ secrets.PX_SANDBOX_SECRET_KEY }}
        run: python -u px_sandbox_strategy_probe.py
