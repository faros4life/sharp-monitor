name: reconcile-live
# Live bot fill reconciliation (Peter, Nov 27). READ-ONLY, zero API credits, dispatch only, nothing committed.
# Authority: the bot's own order rows (reporting/ledger.enc). Log: counts, units, percentages, short ids.
# Games, bets and dollars go only to the private email.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Reconcile
        env:
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -u reconcile_live.py
