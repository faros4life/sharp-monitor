name: pin-gate-backtest

# Muse's GO relayed by Peter, Nov 12: backtest the proposed pre-order Pinnacle price veto.
# NO LIVE DEPLOYMENT AUTHORIZED, and nothing here could deploy one: the job runs one read-only
# script that places no order, writes nothing back, and touches no rule, switch, threshold,
# sizing, routing, venue priority, risk limit or fail-closed protection.
#
# CREDITS: zero paid OddsPapi calls. The gate's own evidence - executor.pin_check() at each live
# order - is already written on the ledger rows in the executor's own emails, so the backtest
# replays what the executor saw rather than buying any history. No billable path is reached:
# clv_ledger.load_markets() is never called, and no /fixtures or /markets request is made.
#
# Dollars go to the private email; the Actions log carries counts, prices and percentages only.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Ledger window in days (pin_check exists from Nov 3 only)"
        default: "30"
        required: false

permissions:
  contents: read

concurrency:
  group: clv-ledger
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Pinnacle gate backtest (read-only, zero credits, no orders)
        env:
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PG_DAYS: ${{ inputs.days || '30' }}
        run: python -u pin_gate_backtest.py
