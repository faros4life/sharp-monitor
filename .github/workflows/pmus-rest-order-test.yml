name: pmus-rest-order-test

# MANUAL ONLY. Places ONE real 1-contract Polymarket US order to prove the venue can hold a
# RESTING, MAKER-ONLY bid (tif GOOD_TILL_DATE + postOnly) rather than the fill-or-kill our code
# has always sent. Peter runs this; Claude does not.
#
# Success here is an order that does NOT fill: the bid is priced 15c below the best offer, so if
# postOnly works it sits on the book and expires on its own after 3 minutes.
#
# THE EXPIRY IS NOT AN EXIT. Nov 9: the venue ACCEPTS tif GOOD_TILL_TIME + goodTillTime and the
# bid rests - but the read-back shows it silently stored the order as TIME_IN_FORCE_DAY with
# goodTillTime null. A 3-minute order became a day order. Both probe runs had to be cancelled by
# hand in the app. So after ANY mode that places an order, CHECK THE APP AND CANCEL.
#
# CANCEL IS SOLVED (Nov 9, run 42748697823). The namespace is SINGULAR - GET /v1/order/{id}
# returns 200 where GET /v1/orders/{id} 404s - and the documented route is
# POST /v1/order/{orderId}/cancel. Every plural and colon shape tried before it was dead.
# So confirm_cancel below cleans up after itself instead of leaving an order for the app.
#
# NEVER /v1/orders/open/cancel. It is cancel-ALL: it answered 200 only because nothing was open
# at the time. Fired while anything of Peter's rests, it kills his orders too. Cancellation here
# is always by explicit order id.
#
# Nothing routes to the resting path until this passes: pmus_place still defaults to fill-or-kill
# and Polymarket US is NOT in REST_BOOKS.
on:
  workflow_dispatch:
    inputs:
      confirm_cancel:
        description: "1 = END-TO-END: place variant B, cancel it by id, prove CANCELED. Cleans up after itself. Needs slug."
        required: false
        type: string
      pdi_test:
        description: "1 = does participateDontInitiate survive the read-back? (the maker flag). Needs slug."
        required: false
        type: string
      discover:
        description: "1 = find the cancel route WITHOUT PLACING ANYTHING (needs order_id; leave slug blank)"
        required: false
        type: string
      order_id:
        description: "For discover: an order id that is ALREADY cancelled or expired. Nothing is placed or cancelled."
        required: false
        type: string
      slug:
        description: "Polymarket US market slug - pick one whose offer is 0.45-0.85 so the bid lands in the proven 0.30-0.70 band. NOT needed for discover."
        required: false
        type: string
      cancel_probe:
        description: "1 = place one resting order and find the cancel endpoint (the last blocker)"
        required: false
        type: string
      probe:
        description: "1 = isolate which resting field the venue rejects (sends FOK baseline, then GTD variants, stops at the first accepted)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Polymarket US resting maker bid test (ONE real contract)
        env:
          CONFIRM_REAL_ORDER: "ONE_DOLLAR"
          PMUS_KEY_ID: ${{ secrets.PMUS_KEY_ID }}
          PMUS_SECRET_KEY: ${{ secrets.PMUS_SECRET_KEY }}
          PMUS_TEST_SLUG: ${{ inputs.slug }}
          PMUS_PROBE: ${{ inputs.probe }}
          PMUS_DISCOVER: ${{ inputs.discover }}
          PMUS_CONFIRM_CANCEL: ${{ inputs.confirm_cancel }}
          PMUS_PDI_TEST: ${{ inputs.pdi_test }}
          PMUS_ORDER_ID: ${{ inputs.order_id }}
          PMUS_CANCEL_PROBE: ${{ inputs.cancel_probe }}
        run: |
          set -o pipefail
          python -u pmus_rest_order_test.py 2>&1 | tee out.txt
          { echo '```'; cat out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
