name: ncaab-fx-r1
# Peter, 17 Nov 2026 ("Do paid calls"): ONE billable /fixtures call to recover the fixture lists for R1's uncovered
# college-basketball games, then FREE Pinnacle history for the matched fixtures, then the cache-only re-certification.
# Dispatch only. Writes the public fixture store and paper/clv_certified.json. clv/ is never written. Log: counts only.
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: paper-clv-certify
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Offline tests
        run: python test_ncaab_fx_r1.py
      - name: Restore shared OddsPapi history cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: hcache
          key: hcache-${{ github.run_id }}
          restore-keys: hcache-
      - name: One paid fixture call + free history
        env:
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          ODDSPAPI_FREE_KEY: ${{ secrets.ODDSPAPI_FREE_KEY }}
        run: python -u ncaab_fx_r1.py
      - name: Save the history cache
        if: always() && steps.restore.outputs.cache-matched-key != ''
        uses: actions/cache/save@v4
        with:
          path: hcache
          key: hcache-${{ github.run_id }}
      - name: Re-certify (cache-only, no key)
        if: always()
        env:
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
        run: python -u paper_clv_certify.py
      - name: Commit the fixture store and the certified file
        if: always()
        run: |
          git status --porcelain --untracked-files=all -- . ':!oddspapi/fixtures_ncaab.json' ':!paper/clv_certified.json' ':!hcache' > "$RUNNER_TEMP/d"
          if [ -s "$RUNNER_TEMP/d" ]; then echo "FAIL: unexpected changes"; cat "$RUNNER_TEMP/d"; exit 1; fi
          git config user.name "ncaab-fx-r1"; git config user.email "ncaab-fx-r1@users.noreply.github.com"
          git add oddspapi/fixtures_ncaab.json paper/clv_certified.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -q -m "NCAAB: R1 fixture recovery + certified Pinnacle CLV"
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:main && { echo committed; exit 0; }
            cp oddspapi/fixtures_ncaab.json "$RUNNER_TEMP/f.json"; cp paper/clv_certified.json "$RUNNER_TEMP/c.json"
            git fetch -q --depth=1 origin main && git reset -q --hard FETCH_HEAD || exit 1
            mkdir -p oddspapi paper
            cp "$RUNNER_TEMP/f.json" oddspapi/fixtures_ncaab.json; cp "$RUNNER_TEMP/c.json" paper/clv_certified.json
            git add oddspapi/fixtures_ncaab.json paper/clv_certified.json
            git commit -q -m "NCAAB: R1 fixture recovery + certified Pinnacle CLV"; sleep 3
          done
          echo "FAIL: push"; exit 1
