name: liq-small-fwd

# $25-50k NBA LIQUIDITY - FORWARD PAPER TEST (Nov 6, Peter). Read-only: reads the executor's Lane 3 shadow ledger emails and
# grades each opportunity at the real price it had at decision time. Daily, started by tick.py. Private email; counts-only log.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Restore shared OddsPapi history cache (restore-only)
        uses: actions/cache/restore@v4
        with:
          path: hcache
          key: hcache-${{ github.run_id }}
          restore-keys: hcache-
      - name: Forward paper report (private email)
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          # Nov 6: required by the fixture-cache reuse in the script; without it the
          # decrypt fails and /fixtures is re-bought silently every run.
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
          ODDSPAPI_FREE_KEY: ${{ secrets.ODDSPAPI_FREE_KEY }}
        run: python -u liq_small_fwd.py
