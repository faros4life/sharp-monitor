name: signal-alerts

on:
  schedule:
    - cron: "3-59/10 * * * *"   # every 10 min, right after the liquidity runs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signal-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Nov 11: the successful run takes 7m40s, so an 8-minute timeout killed every run for 2.5 hours and no
    # phone alert fired. 9 still fits inside the 10-minute schedule; cancel-in-progress: false drops a queued
    # run rather than cutting a live one. This is a stopgap - signal_alerts.py now prints its own step timings
    # so the real cost can be found and removed instead of accommodated.
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Signal alerts (two signals, against your bet, NBA unders, flips; counts only in this log)
        env:
          PUSH_NBA_UNDER: ${{ vars.PUSH_NBA_UNDER }}   # Nov 1 (Peter): NBA UNDER push off unless this repo variable is 1
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Nov 12 (Peter): AGAINST YOUR BET was abandoned at the 240s budget EVERY cycle because
          # registry.enabled() is bool(token()) - without this line the private store is invisible
          # here and bot_orders() could only ever take the 240s+ Gmail path. Read-only in this job:
          # a short-window caller never asserts or refreshes the completeness claim (executor.py).
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          PMUS_KEY_ID: ${{ secrets.PMUS_KEY_ID }}
          PMUS_SECRET_KEY: ${{ secrets.PMUS_SECRET_KEY }}
          PROPHETX_ACCESS_KEY: ${{ secrets.PROPHETX_ACCESS_KEY }}
          PROPHETX_SECRET_KEY: ${{ secrets.PROPHETX_SECRET_KEY }}
          PROPHETX_TRADE_ACCESS_KEY: ${{ secrets.PROPHETX_TRADE_ACCESS_KEY }}
          PROPHETX_TRADE_SECRET_KEY: ${{ secrets.PROPHETX_TRADE_SECRET_KEY }}
          NOVIG_SNAPSHOT_TOKEN: ${{ secrets.NOVIG_SNAPSHOT_TOKEN }}
          NOVIG_READ_TOKEN: ${{ secrets.NOVIG_READ_TOKEN }}   # narrow read credential; preferred over the broad one once it exists
        run: python -u signal_alerts.py
