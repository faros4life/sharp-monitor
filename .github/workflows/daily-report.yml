name: daily-report

# One-screen report of SETTLED bets for an ET day: what we paid, what Pinnacle closed at, the
# result in units, and V1/V2 CLV where they exist. Peter, Nov 20: reporting actual bets must NOT
# wait on the V2 research backfill, so this is deliberately independent of clv-ledger. It is
# READ-ONLY: no API calls, no credits, no writes, no live-trading path. Logs carry units only.
on:
  workflow_dispatch:
    inputs:
      day:
        description: "ET day as YYYY-MM-DD (blank = yesterday ET)"
        required: false
        type: string
  schedule:
    # Cron is UTC and does not know DST, so ONE cron drifts an hour in March (Peter, Nov 20).
    # Both fire; the guard below keeps whichever is 08:xx ET and exits the other, so the report
    # lands at 8:37 AM ET all year instead of 8:37 in winter and 9:37 in summer.
    - cron: "37 12 * * *"
    - cron: "37 13 * * *"

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        # 3.12, matching clv-ledger. On 3.11 'import executor' raised SyntaxError - some module
        # here uses 3.12-only syntax - and the email step failed while the report still printed.
        with: {python-version: "3.12"}
      - run: pip install --quiet cryptography
      - name: skip unless it is the 8am ET hour (scheduled runs only)
        id: gate
        run: |
          H=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$H" != "08" ]; then
            echo "ET hour $H - not the 8am ET firing; skipping"; echo "skip=1" >> $GITHUB_OUTPUT
          fi
      - name: pull Muse's private transfer (existing route, existing token)
        if: steps.gate.outputs.skip != '1'
        continue-on-error: true
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: python3 fetch_transfer.py ${{ inputs.day || '' }}

      - name: report
        if: steps.gate.outputs.skip != '1'
        env:
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          REPORT_EMAIL: "1"
        run: python3 daily_report.py ${{ inputs.day }}
