name: deadman

on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # every 15 min; the script itself only checks 8 AM - midnight ET
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Executor heartbeat check (pushes only if it looks dead)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u deadman.py
