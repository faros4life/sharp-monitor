name: liq-history-test

# Nov 4: liquidity alerts graded at the ALERT price vs the downloaded OddsPapi history (gettable within 60s, Pinnacle
# true close, Pinnacle limit). Paper / measurement only. Reads the shared history cache only (restore-only; cache_only=1 =
# no downloads). Private email; counts-only log.
on:
  workflow_dispatch:
    inputs:
      cache_only: {required: false, type: string, default: "1"}
      get_sec: {required: false, type: string, default: "60"}
      script: {required: false, type: string, default: "liq_history_test.py"}   # Nov 4: also runs close_vs_close_test.py
      frozen: {required: false, type: string, default: "0"}   # Nov 5: 1 = judge only the board's frozen PLAY calls

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Restore shared OddsPapi history cache (read only)
        uses: actions/cache/restore@v4
        with:
          path: hcache
          key: hcache-${{ github.run_id }}
          restore-keys: hcache-
      - name: Liquidity vs history (private email)
        env:
          LIQH_FROZEN: ${{ inputs.frozen }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          ODDSPAPI_FREE_KEY: ${{ secrets.ODDSPAPI_FREE_KEY }}
          # Nov 6 (Peter): lets the run READ clv/state.enc's fixture cache instead of re-buying
          # /fixtures every run. This job is contents: read and never commits, and the script never
          # saves that state, so the ledger cannot be modified from here.
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
          LIQH_CACHE_ONLY: ${{ inputs.cache_only }}
          LIQH_GET_SEC: ${{ inputs.get_sec }}
        run: |
          case "${{ inputs.script }}" in
            liq_history_test.py|close_vs_close_test.py|post_test.py|circa_free_probe.py) python -u "${{ inputs.script }}" ;;
            *) echo "unknown script"; exit 1 ;;
          esac
