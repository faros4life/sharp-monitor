name: toa-recover
# Peter, 26 Nov 2026: recover missing historical Pinnacle CLV from The Odds API (budget up to 2M credits before Dec 1).
# Dispatch only. Fetches into the shared store toa_hist/ (Actions cache, never committed); writes nothing published.
# The certifier and reports read the store cache-only. Log: counts only.
on:
  workflow_dispatch:
    inputs:
      budget:
        description: "credit ceiling for this run"
        default: "2000000"
      dry:
        description: "1 = count only, no paid calls"
        default: "1"
      script:
        description: "toa_recover.py | toa_crosscheck.py"
        default: "toa_recover.py"
      only_fills:
        description: "1 = bot fills only"
        default: "0"
      diag:
        description: "1 = print unmatched rows next to nearest events (zero credits)"
        default: "0"
permissions:
  contents: read
  actions: read
concurrency:
  group: toa-recover
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Offline tests
        run: python test_toa.py
      - name: Restore shared OddsPapi history cache (restore only)
        uses: actions/cache/restore@v4
        with:
          path: hcache
          key: hcache-${{ github.run_id }}
          restore-keys: hcache-
      - name: Restore The Odds API store
        id: toacache
        uses: actions/cache/restore@v4
        with:
          path: toa_hist
          key: toa-hist-${{ github.run_id }}
          restore-keys: toa-hist-
      - name: Restore The Odds API store (artifact fallback)
        if: steps.toacache.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=toa-hist&per_page=1" -q '.artifacts[0].id' || true)
          if [ -n "$id" ]; then gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > /tmp/t.zip && mkdir -p toa_hist && unzip -q -o /tmp/t.zip -d toa_hist && echo "store restored from artifact"; else echo "no store artifact"; fi
      - name: Recover (counts only)
        env:
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TOA_BUDGET: ${{ inputs.budget }}
          TOA_DRY: ${{ inputs.dry }}
          CROSS_MAX_CREDITS: "10000"
          TOA_ONLY_FILLS: ${{ inputs.only_fills }}
          TOA_DIAG: ${{ inputs.diag }}
        run: python -u ${{ inputs.script }}
      - name: Save The Odds API store (partial progress is kept)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: toa_hist
          key: toa-hist-${{ github.run_id }}
      - name: Save The Odds API store (artifact, survives cache eviction)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toa-hist
          path: toa_hist
          retention-days: 90
          if-no-files-found: ignore
