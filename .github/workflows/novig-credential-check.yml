name: novig-credential-check

# Nov 12, 17:20 ET (Peter: "check now we should be good and live"). EXEC_NOVIG_SUBMIT went on at
# ~22:00Z with NOVIG_DISPATCH_TOKEN present, so the dispatch path is now the LIVE path - and
# "present" is not "valid". A token that is expired, scoped to the wrong repository, or missing
# actions access would not fail harmlessly: novig_place() would return an ERROR status, and an
# error MAY have landed at the venue, so it latches. live_guards() would then refuse every
# further live order on every venue until a manual INTENT CLEARED email, which means one bad
# credential takes the whole evening down at the first qualifying play.
#
# This proves the credential WITHOUT sending an order. It makes one GET against the runner
# repository's workflow list: that requires actions:read, which actions:write includes, so a 200
# establishes the token is live, points at faros4life/novig-runner, and carries actions access.
# It does not and cannot prove actions:WRITE - only a real dispatch would, and this workflow
# deliberately never dispatches. Read the PARTIAL verdict it prints as exactly that.
#
# Nothing here places, cancels or modifies an order. No token value is ever printed: only a
# status code, a repository name and a boolean.

on:
  workflow_dispatch:   # manual only

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the Novig credentials read-only (no order, no dispatch)
        env:
          NOVIG_DISPATCH_TOKEN: ${{ secrets.NOVIG_DISPATCH_TOKEN }}
          NOVIG_READ_TOKEN: ${{ secrets.NOVIG_READ_TOKEN }}
          NOVIG_SNAPSHOT_TOKEN: ${{ secrets.NOVIG_SNAPSHOT_TOKEN }}
        run: |
          python -u - <<'PY'
          import json, os, urllib.error, urllib.request

          RUNNER = "faros4life/novig-runner"

          def probe(label, tok, path):
              """One GET. Returns (code, note). Never returns or prints the token."""
              if not tok:
                  return None, "not configured"
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{RUNNER}/{path}",
                  headers={"Authorization": f"Bearer {tok}", "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "novig-credential-check"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as ex:
                  return ex.code, None
              except Exception as ex:
                  return None, f"{type(ex).__name__}"

          print(f"Target runner repository: {RUNNER}")
          print("=" * 84)

          # --- the dispatch credential: the one that is now the live path -------------------
          code, body = probe("dispatch", os.environ.get("NOVIG_DISPATCH_TOKEN", "").strip(),
                             "actions/workflows")
          present = bool(os.environ.get("NOVIG_DISPATCH_TOKEN", "").strip())
          print(f"NOVIG_DISPATCH_TOKEN present={present}")
          if not present:
              print("  NOT CONFIGURED -> novig_place() fails closed and refuses. Nothing can submit.")
              print("  That is a SAFE state, not a broken one.")
          elif code == 200 and isinstance(body, dict):
              n = body.get("total_count")
              print(f"  HTTP 200, {n} workflow(s) visible on {RUNNER}")
              print("  PARTIAL PASS: the token is live, reaches the RIGHT repository, and has")
              print("  actions access. actions:WRITE is NOT proven here - only a real dispatch")
              print("  would prove that, and this check never dispatches.")
          elif code in (401, 403):
              print(f"  HTTP {code} -> the token is EXPIRED, REVOKED, or lacks actions access.")
              print("  THIS IS THE DANGEROUS CASE. The first qualifying play would return an")
              print("  error status, which MAY have landed, so it would LATCH and block every")
              print("  further live order until a manual INTENT CLEARED email.")
              print("  RECOMMENDATION: turn EXEC_NOVIG_SUBMIT off until the token is replaced.")
              raise SystemExit(1)
          elif code == 404:
              print(f"  HTTP 404 -> the token cannot see {RUNNER}: wrong repository scope, or it")
              print("  was issued against a different account. Same latch risk as 401/403.")
              print("  RECOMMENDATION: turn EXEC_NOVIG_SUBMIT off until the scope is corrected.")
              raise SystemExit(1)
          else:
              print(f"  inconclusive (code={code!r}, note={body!r}) - treat as UNPROVEN")

          # --- the read credential and the broad token it is meant to replace ---------------
          print()
          for name in ("NOVIG_READ_TOKEN", "NOVIG_SNAPSHOT_TOKEN"):
              tok = os.environ.get(name, "").strip()
              if not tok:
                  print(f"{name} present=False")
                  continue
              code, body = probe(name, tok, "contents/README.md")
              shape = "readable" if code == 200 else f"HTTP {code}"
              print(f"{name} present=True  {RUNNER} contents: {shape}")

          print()
          print("SAFETY: this job issued GET requests only. No order was placed, cancelled or")
          print("modified, and no token value was printed.")
          PY
