name: bets-board

# Rebuilds the public Bets Board page (GitHub Pages) right after each liquidity run, plus a 10-minute backup timer,
# and keeps the paper-lane log (lanes/lanes.json). Public data only: the liquidity feeds and the sharp feed.
on:
  workflow_run:
    # Nov 1 (Peter): also rebuild right after every executor run (orders / fills) and the hourly balances run
    # (new-position report), so a fill shows on the private tracker within a minute or two.
    workflows: ["liquidity-monitor", "liquidity-extra", "executor-dry-run", "balances-email"]
    types: [completed]
  schedule:
    - cron: "8-59/10 * * * *"
  workflow_dispatch:

concurrency:
  group: bets-board
  cancel-in-progress: false   # never cut a lane-log commit in half

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paper lanes (LIQ-ML-STAY, LIQ-PULL-FADE)
        run: python -u lanes.py
      - name: Phone alert on new PLAY calls (Peter Nov 2; Telegram added Nov 8)
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Nov 8 (Peter): board PLAY calls also go to Telegram. Without these two the push is a
          # SILENT no-op - the same failure mode that cost 5 unapproved OddsPapi credits on Nov 6 -
          # so the secrets and the code ship together.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Nov 9 (Peter): bets-board Telegram pushes OFF. The variable is deliberately NOT passed, so the
          # repo variable cannot switch it back on by itself - restore this line to re-enable.
          # BOARD_TG: ${{ vars.BOARD_TG }}
        run: python -u board_alerts.py
      - run: pip install -q cryptography
      - name: Private bet tracker (encrypted; counts only in this log)
        continue-on-error: true   # a book read failing never stops the board
        env:
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # Nov 3: tracker self-check alerts (no amounts)
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PROPHETX_TRADE_ACCESS_KEY: ${{ secrets.PROPHETX_TRADE_ACCESS_KEY }}
          PROPHETX_TRADE_SECRET_KEY: ${{ secrets.PROPHETX_TRADE_SECRET_KEY }}
          PROPHETX_ACCESS_KEY: ${{ secrets.PROPHETX_ACCESS_KEY }}
          PROPHETX_SECRET_KEY: ${{ secrets.PROPHETX_SECRET_KEY }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          PMUS_KEY_ID: ${{ secrets.PMUS_KEY_ID }}
          PMUS_SECRET_KEY: ${{ secrets.PMUS_SECRET_KEY }}
          NOVIG_SNAPSHOT_TOKEN: ${{ secrets.NOVIG_SNAPSHOT_TOKEN }}
        run: python -u tracker_build.py
      - name: Real plays recap to the phone (Peter Nov 3; once a day after 8 AM ET; counts only in this log)
        continue-on-error: true
        env:
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -u plays_recap.py
      - name: Commit lane log and encrypted tracker state
        run: |
          # Only this workflow writes lanes/ and tracker/; save over upstream, never a merge.
          if [ -n "$(git status --porcelain lanes tracker)" ]; then
            git config user.name "bets-board"
            git config user.email "bets-board@users.noreply.github.com"
            rm -rf "$RUNNER_TEMP/out" && mkdir -p "$RUNNER_TEMP/out" && cp -r lanes "$RUNNER_TEMP/out/" && { [ -d tracker ] && cp -r tracker "$RUNNER_TEMP/out/" || true; }
            for i in 1 2 3 4 5; do
              git fetch -q origin main && git reset -q --hard origin/main
              rm -rf lanes && cp -r "$RUNNER_TEMP/out/lanes" .
              if [ -d "$RUNNER_TEMP/out/tracker" ]; then rm -rf tracker && cp -r "$RUNNER_TEMP/out/tracker" .; fi
              git add -A lanes tracker
              git diff --cached --quiet && break
              git commit -q -m "Update paper lanes / tracker state"
              git push -q origin HEAD:main && break
              sleep 5
            done
          fi
      - name: Build the board
        env:
          # Nov 11 (Peter): the board now shows the bot's own board-lane plays and why each one was
          # or was not taken, which means reading the executor's ledger emails. Read-only.
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -u board_build.py
      - name: Commit the frozen call log (Nov 5; the call each row had when it posted)
        run: |
          # Only this workflow writes board/; save over upstream, never a merge.
          if [ -n "$(git status --porcelain board)" ]; then
            git config user.name "bets-board"
            git config user.email "bets-board@users.noreply.github.com"
            rm -rf "$RUNNER_TEMP/calls" && mkdir -p "$RUNNER_TEMP/calls" && cp -r board "$RUNNER_TEMP/calls/"
            for i in 1 2 3 4 5; do
              git fetch -q origin main && git reset -q --hard origin/main
              rm -rf board && cp -r "$RUNNER_TEMP/calls/board" .
              git add -A board
              git diff --cached --quiet && break
              git commit -q -m "Update frozen board call log"
              git push -q origin HEAD:main && break
              sleep 5
            done
          fi
      - name: Odds screen page (Nov 5; reads odds_screen.json from the repo)
        run: mkdir -p site/odds && cp odds/index.html site/odds/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        continue-on-error: true   # Nov 3: 5-min scans -> more builds; a deploy can collide with one still finishing
        uses: actions/deploy-pages@v4
      - name: Cancel a stuck earlier Pages deploy, then retry once
        if: steps.deploy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Nov 3: a cancelled board run left a Pages deploy "in progress", which blocks every later deploy.
          # Cancel any earlier github-pages deploys (by commit) that are not this run's; finished ones just error.
          for sha in $( (gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=15" --jq '.[].sha'; echo ed1be5234e93df6770a2c7926da7704f5893b781) | sort -u); do
            [ "$sha" = "$GITHUB_SHA" ] && continue
            gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments/$sha/cancel" >/dev/null 2>&1 && echo "cancelled a stuck deploy" || true
          done
          sleep 20
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true   # still busy: the next build (about 5 min) deploys the page
        uses: actions/deploy-pages@v4
