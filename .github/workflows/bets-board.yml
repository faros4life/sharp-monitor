name: bets-board

# The private tracker, the paper-lane log, the phone alerts and the frozen call log.
#
# Nov 11: the PUBLIC PAGE moved to board-page.yml. The tracker step here takes about eight minutes of
# this job's nine-minute timeout; the page took one second and was being held hostage by it, going 90
# minutes without a rebuild. This job still runs board_build.py so board/calls.json keeps being frozen
# and committed - it simply no longer publishes.
on:
  # Nov 11: the four workflow_run triggers were dropped. They existed so the PAGE would rebuild straight after a
  # liquidity or executor run - the page is now its own workflow and rebuilds every 5 minutes, so they bought
  # nothing here and cost everything: each one queued a job behind an 8-minute tracker step, and with
  # cancel-in-progress: false the queued runs were dropped. bets-board last completed at 19:48 and it was 21:30.
  # The 10-minute timer is unchanged, so the frozen call log is still written on the same cadence as before.
  #
  # Nov 12: ONE workflow_run trigger is back, and the note above is exactly why that needs justifying.
  # That note's reason was the 8-minute tracker step - a queued job sat behind it and
  # cancel-in-progress: false dropped it. That step was the timeout killing this workflow, and it is
  # fixed: bot keys and manual notes now come from the private store instead of IMAP.
  # MEASURED, successful runs, newest first: 38s, 48s | 432s, 661s, 642s, 740s, 546s, 538s, 659s,
  # 474s, 463s, 382s. The two post-fix runs are under a minute; the ten before it are 6.4 to 12.3
  # minutes. Nothing queues behind a 43-second job, even firing every 5 minutes.
  #
  # It is back because the 10-minute cron is not being honoured: GitHub fired it FOUR times in 24h
  # (20:47:50Z, 13:05:29Z, 04:22:47Z, 23:39:08Z) - every ~8 hours against a declared 10 minutes - so
  # the private tracker sat hours stale while its runs looked busy. The cron stays as the backup
  # timer. If the tracker step ever regresses past ~4 minutes, runs queue and are dropped again,
  # which is no worse than the state this replaces, and the cron still fires.
  workflow_run:
    workflows: ["executor-dry-run"]
    types: [completed]
  schedule:
    - cron: "8-59/10 * * * *"
  workflow_dispatch:

concurrency:
  group: bets-board
  cancel-in-progress: false   # never cut a lane-log commit in half

permissions:
  contents: write   # Nov 11: the page moved to board-page.yml, so this job needs no pages/id-token

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paper lanes (LIQ-ML-STAY, LIQ-PULL-FADE)
        run: python -u lanes.py
      - name: Phone alert on new PLAY calls (Peter Nov 2; Telegram added Nov 8)
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Nov 8 (Peter): board PLAY calls also go to Telegram. Without these two the push is a
          # SILENT no-op - the same failure mode that cost 5 unapproved OddsPapi credits on Nov 6 -
          # so the secrets and the code ship together.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Nov 9 (Peter): bets-board Telegram pushes OFF. The variable is deliberately NOT passed, so the
          # repo variable cannot switch it back on by itself - restore this line to re-enable.
          # BOARD_TG: ${{ vars.BOARD_TG }}
        run: python -u board_alerts.py
      - run: pip install -q cryptography
      - name: Private bet tracker (encrypted; counts only in this log)
        continue-on-error: true   # a book read failing never stops the board
        env:
          TRACKER_OUT: tracker   # Nov 11: page is committed (encrypted) so board-page.yml can publish it
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # Nov 3: tracker self-check alerts (no amounts)
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PROPHETX_TRADE_ACCESS_KEY: ${{ secrets.PROPHETX_TRADE_ACCESS_KEY }}
          PROPHETX_TRADE_SECRET_KEY: ${{ secrets.PROPHETX_TRADE_SECRET_KEY }}
          PROPHETX_ACCESS_KEY: ${{ secrets.PROPHETX_ACCESS_KEY }}
          PROPHETX_SECRET_KEY: ${{ secrets.PROPHETX_SECRET_KEY }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          PMUS_KEY_ID: ${{ secrets.PMUS_KEY_ID }}
          PMUS_SECRET_KEY: ${{ secrets.PMUS_SECRET_KEY }}
          NOVIG_SNAPSHOT_TOKEN: ${{ secrets.NOVIG_SNAPSHOT_TOKEN }}
          # Nov 12 (Peter: "why is the live bets board still missing the plays"). The plays card
          # now reads the private store before Gmail, but this job had no REGISTRY_TOKEN, so
          # registry.enabled() was False, the store path was skipped entirely, and the card fell
          # straight back to the IMAP read that was failing - showing "Ledger unreadable".
          # Read-only use: the card renders rows, it never writes to the store.
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          NOVIG_READ_TOKEN: ${{ secrets.NOVIG_READ_TOKEN }}   # narrow read credential; preferred over the broad one once it exists
        run: python -u tracker_build.py
      - name: Real plays recap by email (Peter Nov 3; Nov 12 moved off the phone; once a day after 8 AM ET; counts only in this log)
        continue-on-error: true
        env:
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -u plays_recap.py
      - name: Commit lane log and encrypted tracker state
        run: |
          # Only this workflow writes lanes/ and tracker/; save over upstream, never a merge.
          if [ -n "$(git status --porcelain lanes tracker)" ]; then
            git config user.name "bets-board"
            git config user.email "bets-board@users.noreply.github.com"
            rm -rf "$RUNNER_TEMP/out" && mkdir -p "$RUNNER_TEMP/out" && cp -r lanes "$RUNNER_TEMP/out/" && { [ -d tracker ] && cp -r tracker "$RUNNER_TEMP/out/" || true; }
            for i in 1 2 3 4 5; do
              git fetch -q origin main && git reset -q --hard origin/main
              rm -rf lanes && cp -r "$RUNNER_TEMP/out/lanes" .
              if [ -d "$RUNNER_TEMP/out/tracker" ]; then rm -rf tracker && cp -r "$RUNNER_TEMP/out/tracker" .; fi
              git add -A lanes tracker
              git diff --cached --quiet && break
              git commit -q -m "Update paper lanes / tracker state"
              git push -q origin HEAD:main && break
              sleep 5
            done
          fi
      - name: Build the board
        env:
          # Nov 11 (Peter): the board now shows the bot's own board-lane plays and why each one was
          # or was not taken, which means reading the executor's ledger emails. Read-only.
          # Nov 12 (Peter: "fix board"): live_plays_card() now reads those ledger rows from the
          # private store before Gmail, so one IMAP hiccup can no longer blank the card. Without
          # this token registry.enabled() is False in THIS step, the store path is skipped, and the
          # card falls straight back to the IMAP read that printed "Ledger unreadable". Read-only:
          # the card renders rows, it never writes to the store.
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -u board_build.py
      - name: Commit the frozen call log (Nov 5; the call each row had when it posted)
        run: |
          # Only this workflow writes board/; save over upstream, never a merge.
          if [ -n "$(git status --porcelain board)" ]; then
            git config user.name "bets-board"
            git config user.email "bets-board@users.noreply.github.com"
            rm -rf "$RUNNER_TEMP/calls" && mkdir -p "$RUNNER_TEMP/calls" && cp -r board "$RUNNER_TEMP/calls/"
            for i in 1 2 3 4 5; do
              git fetch -q origin main && git reset -q --hard origin/main
              rm -rf board && cp -r "$RUNNER_TEMP/calls/board" .
              git add -A board
              git diff --cached --quiet && break
              git commit -q -m "Update frozen board call log"
              git push -q origin HEAD:main && break
              sleep 5
            done
          fi
