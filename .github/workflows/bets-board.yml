name: bets-board

# Rebuilds the public Bets Board page (GitHub Pages) right after each liquidity run, plus a 10-minute backup timer,
# and keeps the paper-lane log (lanes/lanes.json). Public data only: the liquidity feeds and the sharp feed.
on:
  workflow_run:
    workflows: ["liquidity-monitor", "liquidity-extra"]
    types: [completed]
  schedule:
    - cron: "8-59/10 * * * *"
  workflow_dispatch:

concurrency:
  group: bets-board
  cancel-in-progress: false   # never cut a lane-log commit in half

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paper lanes (LIQ-ML-STAY, LIQ-PULL-FADE)
        run: python -u lanes.py
      - name: Commit lane log
        run: |
          # Only this workflow writes lanes/; save over upstream, never a merge.
          if [ -n "$(git status --porcelain lanes)" ]; then
            git config user.name "bets-board"
            git config user.email "bets-board@users.noreply.github.com"
            rm -rf "$RUNNER_TEMP/out" && mkdir -p "$RUNNER_TEMP/out" && cp -r lanes "$RUNNER_TEMP/out/"
            for i in 1 2 3 4 5; do
              git fetch -q origin main && git reset -q --hard origin/main
              rm -rf lanes && cp -r "$RUNNER_TEMP/out/lanes" .
              git add -A lanes
              git diff --cached --quiet && break
              git commit -q -m "Update paper lanes"
              git push -q origin HEAD:main && break
              sleep 5
            done
          fi
      - name: Build the board
        run: python -u board_build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
