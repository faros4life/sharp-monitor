name: telegram-test

on:
  workflow_dispatch:   # manual: sends ONE test message to Peter's Telegram fill bot

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send a Telegram test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          tok, chat = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip(), os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not tok or not chat:
              sys.exit("Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret.")
          req = urllib.request.Request(f"https://api.telegram.org/bot{tok}/sendMessage", method="POST",
                                       data=json.dumps({"chat_id": chat, "text": "Sharp-monitor fill alerts are connected. Live fills will appear here."}).encode(),
                                       headers={"Content-Type": "application/json"})
          try:
              r = json.loads(urllib.request.urlopen(req, timeout=15).read().decode())
              print("Telegram:", "OK" if r.get("ok") else r)
          except urllib.error.HTTPError as e:
              sys.exit(f"Telegram error {e.code}: {e.read().decode()[:200]}")
          PY
