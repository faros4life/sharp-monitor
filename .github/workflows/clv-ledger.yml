name: clv-ledger

# Live CLV ledger: every real bet vs Pinnacle's true close (OddsPapi free history). Encrypted state; private email once a
# day (and a kill-switch alert line when due). The log prints counts only.
on:
  schedule:
    # Nov 9 (Peter, credit stretch): every 2h -> every 6h. This grades FINISHED games, so grading
    # later gives an identical answer - no data is lost and no H1/H2 gap is created. 39 -> 12
    # billable credits a day. Restore "23 */2 * * *" after the Dec 4 reset if wanted.
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      email_now: {required: false, type: string, default: "1"}

permissions:
  contents: write

concurrency:
  group: clv-ledger
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Nov 19 (Peter: "fix it asap get me clv"). 40 -> 60. Six consecutive runs were killed at 40
    # minutes with "Terminate orphan process: pid (python)" - the timeout tell, not concurrency,
    # which under cancel-in-progress: false drops the QUEUED run and never the running one. The last
    # good run used 32m05s of python; the killed ones reached 38m36s. No Python changed between them
    # (82 commits, all scheduled data updates), so the WORK grew - consistent with the Nov 18
    # game_start recovery making more of the 353 stuck rows scorable. This job runs about every two
    # hours, so a 60-minute ceiling cannot collide with the next firing the way liquidity-extra's
    # would on its 10-minute schedule. The _stage() timings added in the same commit are what will
    # say where the time actually goes; raising this alone would only hide the next increase.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Restore shared OddsPapi history cache (read only)
        uses: actions/cache/restore@v4
        with:
          path: hcache
          key: hcache-${{ github.run_id }}
          restore-keys: hcache-
      - name: CLV ledger (private email)
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          ODDSPAPI_FREE_KEY: ${{ secrets.ODDSPAPI_FREE_KEY }}   # Nov 3: history goes through the free key (paid key: 403 on pinnacle)
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
          # Nov 18 (Peter): READ-ONLY use of the registry's strike map, the same secret
          # reporting-ledger already passes. Without it registry.enabled() is False, so
          # clv_ledger's strike-map recovery never ran and 349 ProphetX rows with no league AND
          # no game text silently restored 0 - the run's own counter said
          # "games restored from the registry strike map: 0" and there was no error, because an
          # empty map is not an exception. The map is an ENTITY map (what a strike IS); it holds
          # no position, price or balance.
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          EMAIL_NOW: ${{ inputs.email_now }}
          # Stage 2 ON (Peter, Nov 13): the selection-level scorecard is the official measurement
          # basis - one bet is one observation however many fills it took. The per-fill figures
          # are still printed below it, unchanged, as the audit basis. Set to "off" to revert;
          # nothing stored changes either way, so the switch is reversible by this line alone.
          CLV_SELECTION_MODE: "on"
        run: python -u clv_ledger.py
      - name: Commit encrypted CLV state
        run: |
          # Only this workflow writes clv/; save over upstream, never a merge.
          if [ -n "$(git status --porcelain clv)" ]; then
            git config user.name "clv-ledger"
            git config user.email "clv-ledger@users.noreply.github.com"
            rm -rf "$RUNNER_TEMP/out" && mkdir -p "$RUNNER_TEMP/out" && cp -r clv "$RUNNER_TEMP/out/"
            for i in 1 2 3 4 5; do
              git fetch -q origin main && git reset -q --hard origin/main
              rm -rf clv && cp -r "$RUNNER_TEMP/out/clv" .
              git add -A clv
              git diff --cached --quiet && break
              git commit -q -m "Update CLV ledger state"
              git push -q origin HEAD:main && break
              sleep 5
            done
          fi
