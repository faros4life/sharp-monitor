name: p1-backtest

# P1 backtest (Nov 3, Peter 12:05): the phase-1 LIVE rule on history, totals vs spreads. Paper / measurement only. Reads the shared OddsPapi
# history cache only (restore-only, no new cache copy; cache_only=1 = no downloads). Private email; counts-only log.
on:
  workflow_dispatch:
    inputs:
      cache_only: {required: false, type: string, default: "1"}

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Restore shared OddsPapi history cache (read only)
        uses: actions/cache/restore@v4
        with:
          path: hcache
          key: hcache-${{ github.run_id }}
          restore-keys: hcache-
      - name: P1 backtest (private email)
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          PLEVEL_CACHE_ONLY: ${{ inputs.cache_only }}
        run: python -u p1_backtest.py
