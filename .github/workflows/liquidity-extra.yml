name: liquidity-extra

on:
  schedule:
    - cron: "5-59/10 * * * *"   # backup timer; cron-job.org is the real one
  workflow_dispatch:

concurrency:
  group: liquidity-extra
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    # 9 -> 18 (Nov 10). PROFILED, not guessed, after my first guess failed.
    #
    # Five consecutive runs died at exactly 9 minutes with "Terminate orphan process: pid
    # (python)". The profile of a killed run: 481.6 of its 551 seconds sit in ONE gap before the
    # Python step prints anything - the book reads - then a Novig direction test, then the kill.
    # The work simply needs more than 9 minutes.
    #
    # WHY MY EARLIER FIX DID NOTHING. I dropped MLB on the reasoning that November has no MLB
    # games. That reasoning was right and the fix was therefore useless: a league with no games
    # costs no time, so removing it saved nothing. The actual consumers are NCAAB and TENNIS.
    #
    # WHY MORE TIME RATHER THAN LESS WORK. Both leagues here are PAPER ONLY - the executor's own
    # refusal reasons list "NCAAB (NCAAF, NBA, NFL only)", and tennis is banned for live - so
    # nothing in this feed reaches a live bet. Freshness therefore matters less than completeness,
    # which makes a longer run the better trade than a smaller call budget
    # (LIQ_EXTRA_BOOKS, left at 900).
    #
    # Collisions are already handled: concurrency cancel-in-progress: false drops the QUEUED run,
    # never the running one, so a ~10-minute run simply means some triggers are skipped - which
    # they were anyway, except the run was being killed instead of finishing.
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check MLB, NCAAB and tennis books (paper)
        env:
          # Nov 10 (Peter: "drop mlb, leave tennis"). MLB is out of season in November, and this
          # workflow had not completed a run since 02:01Z - every firing hit the 9-minute timeout,
          # which GitHub reports as "cancelled", so nine hours of a dead feed looked benign in the
          # run list. It was spending part of that budget enumerating a league with no games.
          # Tennis stays by Peter's instruction (paper only - it is banned for live).
          LIQ_LEAGUES: "NCAAB,TENNIS"        # separate from the main record (liquidity/)
          LIQ_DIR: "liquidity-extra"
          # Nov 10 (Peter: "I want global out and pmus in. We can't use pm global"): global
          # Polymarket dropped. This OVERRIDE is why removing it from liquidity_monitor.BOOKS was
          # not enough on its own - an explicit LIQ_BOOKS here beats the code default, so this
          # workflow kept generating global-priced alerts after the default was changed.
          LIQ_BOOKS: "kalshi,novig,prophetx"   # ProphetX: MLB only (confirming book)
          LIQ_EXTRA_BOOKS: "900"             # this run has only these leagues: give them the normal read limits
          LIQ_EXTRA_SEC: "150"
          LIQ_PRIMARY_MIN: ${{ vars.LIQ_PRIMARY_MIN }}
          LIQ_SECOND_MIN: ${{ vars.LIQ_SECOND_MIN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # read-only sportsbook prices at alert time (MLB/NCAAB only)
          PROPHETX_ACCESS_KEY: ${{ secrets.PROPHETX_ACCESS_KEY }}   # read-only: login + markets, never orders
          PROPHETX_SECRET_KEY: ${{ secrets.PROPHETX_SECRET_KEY }}
        run: python -u liquidity_monitor.py
      - name: Commit state and alerts
        if: always()
        run: |
          # Only this workflow writes liquidity-extra/; save over upstream, never a merge.
          if [ -n "$(git status --porcelain liquidity-extra)" ]; then
            git config user.name "liquidity-extra"
            git config user.email "liquidity-extra@users.noreply.github.com"
            rm -rf "$RUNNER_TEMP/out" && mkdir -p "$RUNNER_TEMP/out" && cp -r liquidity-extra "$RUNNER_TEMP/out/"
            for i in 1 2 3 4 5; do
              git fetch -q origin main && git reset -q --hard origin/main
              rm -rf liquidity-extra && cp -r "$RUNNER_TEMP/out/liquidity-extra" .
              git add -A liquidity-extra
              git diff --cached --quiet && break
              git commit -q -m "Update extra-league liquidity alerts"
              git push -q origin HEAD:main && break
              sleep 5
            done
          fi
