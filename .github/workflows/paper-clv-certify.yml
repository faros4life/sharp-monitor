name: paper-clv-certify
# Peter, 17 Nov 2026: certified Pinnacle CLV for the other Last 50 paper tests from EXISTING cached data only.
# Dispatch only. Restores the shared history cache (never saves it). No OddsPapi key is passed, so no
# API call - paid or free - is possible. Writes only paper/clv_certified.json (CLV percents, no money).
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: paper-clv-certify
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Offline tests
        run: python test_paper_clv_certify.py
      - name: Restore shared OddsPapi history cache (restore only, never saved)
        uses: actions/cache/restore@v4
        with:
          path: hcache
          key: hcache-${{ github.run_id }}
          restore-keys: hcache-
      - name: Certify (cache-only; counts in this log)
        env:
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
        run: python -u paper_clv_certify.py
      - name: Commit the certified file only
        run: |
          git status --porcelain --untracked-files=all -- . ':!paper/clv_certified.json' ':!hcache' > "$RUNNER_TEMP/d"
          if [ -s "$RUNNER_TEMP/d" ]; then echo "FAIL: unexpected changes"; cat "$RUNNER_TEMP/d"; exit 1; fi
          git config user.name "paper-clv-certify"; git config user.email "paper-clv-certify@users.noreply.github.com"
          git add paper/clv_certified.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -q -m "paper: certified Pinnacle CLV (cache-only)"
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:main && { echo committed; exit 0; }
            cp paper/clv_certified.json "$RUNNER_TEMP/c.json"
            git fetch -q --depth=1 origin main && git reset -q --hard FETCH_HEAD || exit 1
            mkdir -p paper; cp "$RUNNER_TEMP/c.json" paper/clv_certified.json
            git add paper/clv_certified.json && git commit -q -m "paper: certified Pinnacle CLV (cache-only)"; sleep 3
          done
          echo "FAIL: push"; exit 1
