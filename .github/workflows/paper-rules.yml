name: paper-rules

# Forward paper tracker for queue items 25, 27, 29-33 and 50 (Peter Nov 3). Reads the public alerts.json only; no
# OddsPapi calls, no bets. Private email daily; the log prints counts only.
on:
  schedule:
    - cron: "17 14 * * *"   # ~9:17 AM ET
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Paper rules tracker (private email)
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -u paper_rules.py
