name: novig-snapshot-check

on:
  workflow_dispatch:   # manual: can the executor read the home PC's Novig positions snapshot? Prints counts only.
    inputs:
      orders:
        description: "Comma-separated Novig order ids or client ids to reconcile against actual fills"
        required: false
        default: ""

concurrency:
  # Nov 12 (Peter): this workflow carries the REAL EXEC_NOVIG_SUBMIT and EXEC_LIVE values and had
  # no concurrency group, so two overlapping runs were possible. That is the same concurrent vector
  # that let two executor runs both pass the LIVEKEYS read and submit the same play. It reads
  # snapshots rather than placing, so this is defence in depth, not a found duplicate.
  #
  # cancel-in-progress: false, exactly as the executor has it - an in-flight run is never cut off;
  # a newer queued one is dropped. Position snapshots are unaffected: a dropped run is followed by
  # another within minutes, and nothing here is half-written.
  group: novig-snapshot-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Read the snapshot exactly as the executor does
        env:
          NOVIG_SNAPSHOT_TOKEN: ${{ secrets.NOVIG_SNAPSHOT_TOKEN }}
          NOVIG_READ_TOKEN: ${{ secrets.NOVIG_READ_TOKEN }}   # narrow read credential; preferred over the broad one once it exists
          RECONCILE_ORDERS: ${{ inputs.orders }}
          # Nov 12: the fills probe needs the READ-ONLY key. Without these two the probe reported
          # "key ready -> False, scope None", which was this workflow's missing env and NOT
          # evidence that Novig blocks Actions. Read-only scope; novig_signed refuses any key
          # whose scope is not read-only.
          NOVIG_READ_KEY_ID: ${{ secrets.NOVIG_READ_KEY_ID }}
          NOVIG_READ_KEY_PEM: ${{ secrets.NOVIG_READ_KEY_PEM }}
          NOVIG_TRADE_KEY_ID: ${{ secrets.NOVIG_TRADE_KEY_ID }}
          # Nov 12 (Peter): "Confirm my STOP is actually active in production" and "Verify the
          # Novig submission setting rather than assuming it is off." Both are read here from the
          # SAME env the executor sees, so the answer is production state, not my assumption.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EXEC_NOVIG_SUBMIT: ${{ vars.EXEC_NOVIG_SUBMIT }}
          EXEC_LIVE: ${{ vars.EXEC_LIVE }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          python -u - <<'PY'
          import os
          import executor as e
          pos = e.novig_snapshot()
          if pos is None:
              print("SNAPSHOT: FAILED ->", (e._NVERR.get("why") or "").strip(" |")[:200])
              raise SystemExit(1)
          print(f"SNAPSHOT: OK - {len(pos)} open Novig position(s); source: {e._NVERR.get('src')}")
          # Nov 12 (Peter, "use the api not emails"): the count alone cannot answer "did the bot
          # place this bet more than once", which is a MONEY question - three R1 orders went out on
          # one NCAAF under this morning and only one fill was reported. Print one line per open
          # position and a per-key COUNT, so a duplicate is visible here instead of only in a
          # private email. Counts and names only: no stake, no price, no balance (CLAUDE.md).
          import collections
          print("fields present on a position row:", sorted({k for p in pos for k in p}))
          named = sum(1 for p in pos if (p.get("game") or "").strip())
          print(f"rows with a readable game name: {named}/{len(pos)}"
                + ("   <- names did not resolve; identity below is marketId/outcomeId" if named < len(pos) else ""))
          keys = collections.Counter()
          qty = collections.Counter()
          for p in pos:
              k = (f"{p.get('league') or ''} {p.get('game') or ''} {p.get('label') or ''}".strip()
                   or f"market {p.get('marketId')} outcome {p.get('outcomeId')}")
              keys[k] += 1
              qty[k] += int(p.get("qty") or 0)
          for k, n in keys.most_common():
              print(f"  {('DUPLICATE x' + str(n)) if n > 1 else 'x1':<13} {qty[k]:>9,} contracts  {k}")
          dup = sum(n for n in keys.values() if n > 1)
          print(f"DISTINCT bets: {len(keys)} | positions sitting on a duplicated bet: {dup}")
          # Nov 12 (Peter): "Reconcile each of the three order IDs against actual fills and final
          # order status. Don't infer 'killed' from the position count or liquidity." The home
          # runner's own order results are the record of what the venue did with each submission.
          import book_live as bl
          recs = bl.novig_results()
          if recs is None:
              print("ORDERS: UNREADABLE - home runner results could not be read. Outcome UNKNOWN.")
          else:
              want = [w for w in (os.environ.get("RECONCILE_ORDERS") or "").split(",") if w.strip()]
              print(f"ORDERS: {len(recs)} result row(s) from the home runner")
              # Nov 12 (Peter): the mapping fix needs to know which field, if any, carries NOVIG's
              # own order id alongside the locally generated client id. Field names first - the
              # same discipline clv_link_recon.py used - rather than guessing an endpoint.
              print("ORDER ROW FIELDS:", sorted({k for x in recs for k in x}))
              for x in recs[-3:]:
                  print("  sample:", {k: (str(v)[:38] if v is not None else None)
                                      for k, v in x.items() if k not in ("order", "error")})
              by = {}
              for x in recs:
                  for ident in (x.get("order_id"), x.get("client_id")):
                      if ident:
                          by[str(ident)] = x
              for w in want:
                  w = w.strip()
                  x = by.get(w)
                  if not x:
                      print(f"  {w[:8]}  NO RESULT ROW -> outcome UNKNOWN, treat as possibly live")
                      continue
                  st = str(x.get("status") or "?").upper()
                  fq = int(x.get("filled_qty") or 0)
                  q = int(x.get("qty") or 0)
                  tag = ("FILLED" if q and fq >= q else "PARTIAL" if fq > 0 else
                         "NO FILL / KILLED" if st in ("CANCELED", "CANCELLED", "KILLED", "EXPIRED", "REJECTED", "REFUSED")
                         else "STILL OPEN" if st == "OPEN" else f"UNRESOLVED ({st})")
                  print(f"  {w[:8]}  status {st:<10} {fq:>7,}/{q:<7,} contracts  -> {tag}")
          # Nov 12 (Peter): finish reconciling the two unknown orders through an AUTHENTICATED
          # read. /v3/portfolio/fills carries orderId, so a fill for either id settles it. This
          # also records, in the log, WHETHER an authenticated read is possible from Actions at
          # all - Novig is understood to block datacenter IPs, and that claim should be evidenced
          # rather than repeated.
          try:
              import novig_signed as nv
              print("AUTH READ: key ready ->", nv.ready(), "| scope:", nv._S.get("scope"))
              try:
                  # nv.get returns a dict KEYED BY WALLET, not a bare list, and keyId is required.
                  # Parsing it as items/fills read 0 rows - the same error clv_link_recon.py
                  # already documents. Both wallets, paginated, unwrapped via d.values().
                  rows = []
                  for kid in dict.fromkeys([nv._S["id"], (os.environ.get("NOVIG_TRADE_KEY_ID") or "").strip()]):
                      if not kid:
                          continue
                      after, pages = None, 0
                      while pages < 20:
                          pages += 1
                          prm = {"limit": 100, "keyId": kid}
                          if after:
                              prm["after"] = after
                          d = nv.get("/v3/portfolio/fills", prm)
                          got, nxt = [], None
                          for v in (d.values() if isinstance(d, dict) else [d]):
                              if isinstance(v, list):
                                  got += v
                              elif isinstance(v, dict):
                                  got += v.get("items") or v.get("fills") or v.get("data") or []
                                  nxt = nxt or v.get("next")
                          if isinstance(d, dict):
                              nxt = nxt or d.get("next")
                          rows += got
                          if not got or not nxt:
                              break
                          after = nxt
                  print(f"AUTH READ: OK - {len(rows)} fill row(s) readable from Actions")
                  oids = {str(r.get("orderId") or r.get("order_id") or "") for r in rows}
                  for w in [x.strip() for x in (os.environ.get("RECONCILE_ORDERS") or "").split(",") if x.strip()]:
                      print(f"  fills carry {w[:8]}: {w in oids}")
              except Exception as ex:
                  print("AUTH READ: fills FAILED ->", str(ex)[:160])
          except Exception as ex:
              print("AUTH READ: unavailable ->", str(ex)[:160])
          # --- verified pause status, read from production env ---
          import book_live as _bl, px_live as _px
          print("PAUSE: EXEC_NOVIG_SUBMIT raw =", repr(os.environ.get("EXEC_NOVIG_SUBMIT")),
                "-> novig submissions allowed:", _bl.NOVIG_SUBMIT)
          print("PAUSE: EXEC_LIVE raw =", repr(os.environ.get("EXEC_LIVE")), "-> px_live.LIVE:", _px.LIVE)
          try:
              w, when = _px.stop_state()
              print(f"PAUSE: ntfy/latched switch = {w!r} (when={when})")
          except Exception as ex:
              print("PAUSE: switch unreadable ->", str(ex)[:120])
          try:
              ok, why = _bl.preflight("novig", 10.0)
              print(f"PAUSE: preflight(novig) -> allowed={ok}  reason={str(why)[:110]}")
              ok2, why2 = _bl.preflight("kalshi", 10.0)
              print(f"PAUSE: preflight(kalshi) -> allowed={ok2}  reason={str(why2)[:110]}")
          except Exception as ex:
              print("PAUSE: preflight raised ->", str(ex)[:120])
          # --- are there ANY resting/open orders? Peter says none; check, do not assume ---
          if recs is not None:
              openish = [x for x in recs if str(x.get("status") or "").upper() in ("OPEN", "PENDING", "SENT", "UNKNOWN")
                         or (x.get("tif") == "GTT" and str(x.get("status") or "").upper() == "OPEN")]
              print(f"OPEN ORDERS: {len(openish)} row(s) not in a final state")
              for x in openish[-8:]:
                  print(f"  status {str(x.get('status') or '?').upper():<9} tif {str(x.get('tif') or '-'):<4} "
                        f"{int(x.get('filled_qty') or 0):>7,}/{int(x.get('qty') or 0):<7,}  {str(x.get('label') or '')[:52]}")
              gtt = [x for x in recs if str(x.get("tif") or "") == "GTT"]
              print(f"RESTING (GTT) rows ever: {len(gtt)}; of those still OPEN: "
                    f"{len([x for x in gtt if str(x.get('status') or '').upper() == 'OPEN'])}")
          PY
