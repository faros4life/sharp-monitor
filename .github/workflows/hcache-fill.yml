name: hcache-fill

# Fills the shared OddsPapi history cache (private Actions cache, never committed) with every finished NBA/NFL/NCAAF/NHL
# game since Oct 12 for Pinnacle, the exchanges and Hard Rock, so models and tests run from disk. Started daily by tick.py;
# dispatch to work through the backlog. Free history calls (plus 4 billable /fixtures). The log prints counts only.
# Nov 2 (Peter: faster): order = newest | oldest (a 2nd fill can work the other end); merge_a / merge_b = earlier fill run
# ids whose caches are folded in first; the cache is saved even if the run is stopped or times out.
on:
  workflow_dispatch:
    inputs:
      max_games: {required: false, type: string, default: "700"}
      order: {required: false, type: string, default: "newest"}
      merge_a: {required: false, type: string, default: ""}
      merge_b: {required: false, type: string, default: ""}

permissions:
  contents: read
  actions: write   # Nov 4: start the next batch when this one stopped at its time budget

concurrency:
  group: hcache-fill-${{ inputs.order || 'newest' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Restore shared OddsPapi history cache (private Actions cache, never committed)
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: hcache
          key: hcache-${{ github.run_id }}
          restore-keys: hcache-
      - name: Restore another fill's cache (merge_a)
        if: inputs.merge_a != ''
        uses: actions/cache/restore@v4
        with:
          path: hcache_a
          key: hcache-${{ inputs.merge_a }}
      - name: Restore another fill's cache (merge_b)
        if: inputs.merge_b != ''
        uses: actions/cache/restore@v4
        with:
          path: hcache_b
          key: hcache-${{ inputs.merge_b }}
      - name: Fill the cache
        id: fill
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          ODDSPAPI_FREE_KEY: ${{ secrets.ODDSPAPI_FREE_KEY }}   # Nov 3: free-account key for exchange history (empty = not used)
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}   # Nov 3: read other jobs' saved game lists (0 credits)
          FILL_MAX: ${{ inputs.max_games }}
          FILL_ORDER: ${{ inputs.order }}
          FILL_MERGE: hcache_a,hcache_b
        run: python -u hcache_fill.py
      - name: Save the cache even if the run is stopped or times out
        # Nov 3 20:05: only when the shared cache was really restored - a failed restore once saved an EMPTY newest cache
        if: always() && steps.restore.outputs.cache-matched-key != ''
        uses: actions/cache/save@v4
        with:
          path: hcache
          key: hcache-${{ github.run_id }}
      - name: Start the next batch (only after a successful save, only if games remain)
        if: success() && steps.fill.outputs.more == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hcache-fill.yml --repo "${{ github.repository }}" --ref main -f max_games="${{ inputs.max_games || '700' }}" -f order="${{ inputs.order || 'newest' }}"
