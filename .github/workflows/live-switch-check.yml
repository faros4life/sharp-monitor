name: live-switch-check

on:
  workflow_dispatch:   # manual: runs the live pre-order checks (STOP/GO, registry, daily stop) and places NOTHING

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # 3 -> 10 (Nov 11, Peter). Run 43024024660 was KILLED MID-WORK at 3m18s against the 3-minute
    # ceiling - "Terminate orphan process: pid (python)" - and reported as `cancelled` with no
    # verdict printed. At a glance that is indistinguishable from the BRAKE having failed, which is
    # the one thing this job exists to report truthfully. The job places nothing (no order code), so
    # a higher ceiling costs nothing; what varies is the Gmail IMAP read in live_guards().
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Brake check (no orders)
        env:
          EXEC_LIVE: "on"   # THIS job only, so preflight reaches the STOP check; no order code runs here
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PROPHETX_TRADE_ACCESS_KEY: ${{ secrets.PROPHETX_TRADE_ACCESS_KEY }}
          PROPHETX_TRADE_SECRET_KEY: ${{ secrets.PROPHETX_TRADE_SECRET_KEY }}
        run: python -u live_switch_check.py
