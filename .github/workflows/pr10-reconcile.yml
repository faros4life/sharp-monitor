name: pr10-reconcile

# REVIEW ONLY, READ-ONLY, DISPATCH ONLY. No schedule - it runs when Peter asks and never on its own.
# It produces the two private-data preconditions for draft PR #10: the backfill list of orders that
# already carry exposure, and the MIN @ SF replay. Both need TRACKER_PASSPHRASE and the registry
# token, which live here and nowhere else. Public log gets COUNTS ONLY; detail goes to the Bets
# inbox. It places nothing, cancels nothing and writes nothing - EXEC_UNIT_LEDGER is not read.

on:
  workflow_dispatch:
    inputs:
      match:
        description: "Term identifying the incident to replay (e.g. the MIN @ SF game string)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: pr10-reconcile
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/per-play-unit-exposure-guard-20261122
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Private reconciliation (read-only)
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          REPLAY_MATCH: ${{ inputs.match }}
        run: python -u review_replay.py
