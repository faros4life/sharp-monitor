name: p2-audit
# Project 2. Dispatch only. READ-ONLY: decrypts tracker/state.enc, reads the private registry with a GET. No Gmail secrets, no odds key,
# no exchange TRADING keys (Novig read key + ProphetX data key only, for the venue fill/trade link), no commit, no cache, no artifact upload. Public log = counts only. The dollar / ROI report goes only to
# Peter's private Telegram (Peter approved Nov 14 18:06 ET).
on:
  # SCHEDULE: tick.py (DAILY_ET / JOBS) is the only scheduler - GitHub cron barely fires in this repo and is UTC-fixed.
  workflow_dispatch:
    inputs:
      report_day:
        description: "ET day for section E (YYYY-MM-DD); blank = yesterday"
        required: false
        default: ""
permissions:
  contents: read
  actions: read      # gate only: lists this workflow's own earlier runs
concurrency:
  group: p2-audit
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          EV: ${{ github.event_name }}
          UP: ${{ github.event.workflow_run.conclusion }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          # tick.py dispatches as github-actions[bot]: that is the AUTOMATIC daily path, not a person
          if [ "$EV" = "workflow_dispatch" ] && [ "$ACTOR" != "github-actions[bot]" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; echo "manual: runs"; exit 0; fi
          if [ "$EV" = "workflow_run" ] && [ "$UP" != "success" ]; then echo "go=0" >> "$GITHUB_OUTPUT"; echo "upstream not successful: skip"; exit 0; fi
          today=$(TZ=America/New_York date +%F)
          # ET midnight in UTC, so "already sent today" is judged on the ET day the report belongs to
          since=$(date -u -d "TZ=\"America/New_York\" $today 00:00" +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/p2-audit.yml/runs?status=success&created=>=${since}&per_page=50" \
                --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID} and (.event != \"workflow_dispatch\" or .triggering_actor.login == \"github-actions[bot]\"))] | length")
          if [ "${n:-0}" -gt 0 ]; then echo "go=0" >> "$GITHUB_OUTPUT"; echo "automatic report already delivered for $today: skip"
          else echo "go=1" >> "$GITHUB_OUTPUT"; echo "first automatic report for $today: runs"; fi
  run:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Offline checks (no secrets)
        run: python test_p2_audit_core.py
      - name: Project 2 audit (read-only)
        env:
          REPORT_DAY: ${{ inputs.report_day }}
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}   # contents read on the private registry
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # private delivery only (same route as last50-report)
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOVIG_READ_KEY_ID: ${{ secrets.NOVIG_READ_KEY_ID }}       # read-only (novig_signed.ready verifies the scope)
          NOVIG_READ_KEY_PEM: ${{ secrets.NOVIG_READ_KEY_PEM }}
          NOVIG_READ_TOKEN: ${{ secrets.NOVIG_READ_TOKEN }}   # Nov 17 Option A: Contents READ on novig-runner only (home fill snapshot)
          P2_NV_FALLBACK: shadow   # shadow = compare only; set to on after the home snapshot matches the cloud read
          NOVIG_TRADE_KEY_ID: ${{ secrets.NOVIG_TRADE_KEY_ID }}     # key ID only, to read the bot sub-wallet; no trade PEM
          PROPHETX_ACCESS_KEY: ${{ secrets.PROPHETX_ACCESS_KEY }}   # DATA key (read-only), GET trades
          PROPHETX_SECRET_KEY: ${{ secrets.PROPHETX_SECRET_KEY }}
        run: python -u p2_audit.py
