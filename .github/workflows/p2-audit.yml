name: p2-audit
# Project 2. Dispatch only. READ-ONLY: decrypts tracker/state.enc, reads the private registry with a GET. No Gmail secrets, no odds key,
# no exchange TRADING keys (Novig read key + ProphetX data key only, for the venue fill/trade link), no commit, no cache, no artifact upload. Public log = counts only. The dollar / ROI report goes only to
# Peter's private Telegram (Peter approved Nov 14 18:06 ET).
on:
  schedule:
    - cron: "52 9 * * *"     # 04:52 ET daily, after reporting-ledger (04:32 ET). One private Telegram report a day.
  workflow_dispatch:
    inputs:
      report_day:
        description: "ET day for section E (YYYY-MM-DD); blank = yesterday"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: p2-audit
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Offline checks (no secrets)
        run: python test_p2_audit_core.py
      - name: Project 2 audit (read-only)
        env:
          REPORT_DAY: ${{ inputs.report_day }}
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}   # contents read on the private registry
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # private delivery only (same route as last50-report)
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOVIG_READ_KEY_ID: ${{ secrets.NOVIG_READ_KEY_ID }}       # read-only (novig_signed.ready verifies the scope)
          NOVIG_READ_KEY_PEM: ${{ secrets.NOVIG_READ_KEY_PEM }}
          NOVIG_TRADE_KEY_ID: ${{ secrets.NOVIG_TRADE_KEY_ID }}     # key ID only, to read the bot sub-wallet; no trade PEM
          PROPHETX_ACCESS_KEY: ${{ secrets.PROPHETX_ACCESS_KEY }}   # DATA key (read-only), GET trades
          PROPHETX_SECRET_KEY: ${{ secrets.PROPHETX_SECRET_KEY }}
        run: python -u p2_audit.py
