name: plimit-probe

# On demand: one-off OddsPapi read-path probe for Pinnacle limits (about 8 calls). Private email; counts only here.
on:
  workflow_dispatch:
    inputs:
      hr_fixture: {required: false, type: string, default: ""}

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: PLIMIT probe (private email)
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          HR_FIXTURE: ${{ inputs.hr_fixture }}
        run: python -u plimit_probe.py
