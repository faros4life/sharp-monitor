name: executor-dry-run

on:
  schedule:
    - cron: "7-59/10 * * * *"   # backup timer; cron-job.org is the real one
  workflow_dispatch:

concurrency:
  group: executor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # 20 -> 30 (Nov 10, Peter's go). The run at 12:45:12Z was KILLED MID-PASS: the log ends at
    # "newer alerts.json landed during the run: pass 2" with "Terminate orphan process: pid
    # (python)". Passes take 6-15 minutes each and up to 3 can fire, so 20 minutes does not fit
    # the work this workflow is allowed to do.
    #
    # WHY THIS MATTERS MORE THAN A LOST RUN. Gmail is the bot-order registry, and it is now
    # MEASURED that it cannot be replaced: a ProphetX trade carries fee, id, matched_at, order_id,
    # price, profit, quantity, status, strike, strike_id, winning_status - and NOT external_id, so
    # nothing at the venue identifies a bot order. A kill between placing an order and sending the
    # ledger email therefore strands that order outside the only registry that can attribute it,
    # and today_result silently excludes it - the daily stop undercounts, on the one guard that
    # caps a losing day. The 12:45 run had placed nothing, which was luck, not design.
    #
    # Raising it is the safe direction HERE, and was the wrong move for liquidity-extra. This
    # workflow has concurrency cancel-in-progress: false, so a longer run only drops more QUEUED
    # runs - harmless, because the schedule overlaps and a dropped run is followed by another
    # within minutes. Never kill a half-finished order pass so a newer one can start.
    timeout-minutes: 30   # Oct 29: held-retry loop; Nov 1: up to 3 catch-up passes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Dry run (no order code; emails only; counts in this log)
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Step 1 (Peter, 9 Nov): READ-ONLY access to the shared credit counter in clv/state.enc,
          # so the 1,000-call cap can actually restrain Lane 2. Without it tb.PASS is empty, the
          # AES-GCM key derives from nothing, and the seed failed with InvalidTag - which is why
          # the 08:40 run reported "SEED UNAVAILABLE - cap not enforced". Nothing is written or
          # committed by this job; it only reads the counter.
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
          NOVIG_READ_KEY_ID: ${{ secrets.NOVIG_READ_KEY_ID }}       # read-only: positions for duplicate/conflict checks
          NOVIG_READ_KEY_PEM: ${{ secrets.NOVIG_READ_KEY_PEM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}       # fill texts to Peter's Telegram (live orders only)
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOVIG_SNAPSHOT_TOKEN: ${{ secrets.NOVIG_SNAPSHOT_TOKEN }}   # read-only token for the home runner's Novig positions snapshot (private repo)
          KAY_HARDROCK: ${{ secrets.KAY_HARDROCK }}                   # Kay's Hard Rock bucket (manual figure) for the balances email
          PROPHETX_ACCESS_KEY: ${{ secrets.PROPHETX_ACCESS_KEY }}   # used only to read ProphetX prices
          PROPHETX_SECRET_KEY: ${{ secrets.PROPHETX_SECRET_KEY }}
          NOVIG_TRADE_KEY_ID: ${{ secrets.NOVIG_TRADE_KEY_ID }}     # ID only: reads the auto-place subaccount's positions
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}               # positions only (GET); no order code in the dry run
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          PMUS_KEY_ID: ${{ secrets.PMUS_KEY_ID }}                   # positions only (GET)
          PMUS_SECRET_KEY: ${{ secrets.PMUS_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}                     # phone alert when a bet is held (positions unreadable)
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}                 # Nov 3: Pinnacle price check at each live order (read only)
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}               # Nov 4: Lane 2 reads Pinnacle's LIMIT at decision time (dry run only)
          EXEC_UNIT: "300"
          # LIVE phase 1 (Oct 26): real ProphetX orders only when the repo VARIABLE EXEC_LIVE is "on"
          EXEC_LIVE: ${{ vars.EXEC_LIVE }}
          # Nov 3 (Peter "ok build"): Lane 3 board NBA totals places money only when this is "on" (and EXEC_LIVE is on)
          EXEC_BOARD_LIVE: ${{ vars.EXEC_BOARD_LIVE || 'off' }}   # Nov 4 7:41 AM (Peter): LANE 3 OFF for live money - board plays are paper only
          # Nov 11 (Peter "NO MORE PAPER"): R1 live lane (non-Top-25 college, ProphetX-priced spreads + unders). Places money only
          # when this repo VARIABLE is "on" (and EXEC_LIVE is on). Own $200 unit; own daily risk limit and play cap below.
          EXEC_R1_LIVE: ${{ vars.EXEC_R1_LIVE || 'off' }}
          EXEC_R1_DAILY_RISK: ${{ vars.EXEC_R1_DAILY_RISK || '1500' }}
          EXEC_R1_MAX_PLAYS: ${{ vars.EXEC_R1_MAX_PLAYS || '10' }}
          PX_QTY_MEANS: ${{ vars.PX_QTY_MEANS }}                   # "stake" (default) or "to_win" - set from the $1 test
          PROPHETX_TRADE_ACCESS_KEY: ${{ secrets.PROPHETX_TRADE_ACCESS_KEY }}
          PROPHETX_TRADE_SECRET_KEY: ${{ secrets.PROPHETX_TRADE_SECRET_KEY }}
        # Nov 1: a wake that arrives while another executor run is busy can be dropped by GitHub's queue (the 6:00 AM
        # Celtics/Magic alert waited 10 min for the timer). So after each pass, if alerts.json got a newer commit
        # than this pass started with, pull it and run again (up to 3 extra passes, same job = never two at once).
        run: |
          python -u executor.py
          for i in 1 2 3; do
            git fetch -q origin main || break
            if git diff --quiet HEAD origin/main -- alerts.json; then break; fi
            echo "newer alerts.json landed during the run: pass $((i + 1))"
            git reset -q --hard origin/main
            python -u executor.py
          done
