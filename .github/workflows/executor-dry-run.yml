name: executor-dry-run

on:
  schedule:
    - cron: "7-59/10 * * * *"   # backup timer; cron-job.org is the real one
  workflow_dispatch:
    inputs:
      pin_read:
        description: "1 = read Pinnacle for the line-value SHADOW reference this run (bounded diagnostic; spends The Odds API credits). Scheduled runs never read."
        default: "0"

concurrency:
  group: executor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # 20 -> 30 (Nov 10, Peter's go). The run at 12:45:12Z was KILLED MID-PASS: the log ends at
    # "newer alerts.json landed during the run: pass 2" with "Terminate orphan process: pid
    # (python)". Passes take 6-15 minutes each and up to 3 can fire, so 20 minutes does not fit
    # the work this workflow is allowed to do.
    #
    # WHY THIS MATTERS MORE THAN A LOST RUN. Gmail is the bot-order registry, and it is now
    # MEASURED that it cannot be replaced: a ProphetX trade carries fee, id, matched_at, order_id,
    # price, profit, quantity, status, strike, strike_id, winning_status - and NOT external_id, so
    # nothing at the venue identifies a bot order. A kill between placing an order and sending the
    # ledger email therefore strands that order outside the only registry that can attribute it,
    # and today_result silently excludes it - the daily stop undercounts, on the one guard that
    # caps a losing day. The 12:45 run had placed nothing, which was luck, not design.
    #
    # Raising it is the safe direction HERE, and was the wrong move for liquidity-extra. This
    # workflow has concurrency cancel-in-progress: false, so a longer run only drops more QUEUED
    # runs - harmless, because the schedule overlaps and a dropped run is followed by another
    # within minutes. Never kill a half-finished order pass so a newer one can start.
    timeout-minutes: 30   # Oct 29: held-retry loop; Nov 1: up to 3 catch-up passes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Dry run (no order code; emails only; counts in this log)
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Nov 12 (Peter, Step 1): the Kalshi resting-fill reporter now runs in the fill-reports
          # workflow every 15 minutes. It was 518.8s of a 632-second pass here - 82% - and gates
          # nothing, and that is what held this run open past the 12-minute registry freshness
          # window. Verified working standalone in run 43290413830 before this line went in.
          # Novig reporting is NOT affected and stays in this job with its venue reconciliation.
          # To put it back: delete this line. No code change needed; the code default is "on".
          EXEC_KALSHI_REPORTS: "off"
          # Step 1 (Peter, 9 Nov): READ-ONLY access to the shared credit counter in clv/state.enc,
          # so the 1,000-call cap can actually restrain Lane 2. Without it tb.PASS is empty, the
          # AES-GCM key derives from nothing, and the seed failed with InvalidTag - which is why
          # the 08:40 run reported "SEED UNAVAILABLE - cap not enforced". Nothing is written or
          # committed by this job; it only reads the counter.
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
          NOVIG_READ_KEY_ID: ${{ secrets.NOVIG_READ_KEY_ID }}       # read-only: positions for duplicate/conflict checks
          NOVIG_READ_KEY_PEM: ${{ secrets.NOVIG_READ_KEY_PEM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}       # fill texts to Peter's Telegram (live orders only)
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOVIG_SNAPSHOT_TOKEN: ${{ secrets.NOVIG_SNAPSHOT_TOKEN }}   # read-only token for the home runner's Novig positions snapshot (private repo)
          NOVIG_READ_TOKEN: ${{ secrets.NOVIG_READ_TOKEN }}   # narrow read credential; preferred over the broad one once it exists
          # Nov 11 (Peter, "b2"): Contents read+write on ONE private repo, for the bot's own
          # registry - placed orders, write-ahead intents, dedupe tokens. Replaces Gmail, which
          # cost 79.3s a run (90% of measured time) because sharp-monitor is public and money
          # cannot go in it. Deliberately a SEPARATE token from NOVIG_SNAPSHOT_TOKEN so that one
          # stays read-only. Until this secret exists registry.enabled() is False and every path
          # stays on Gmail, unchanged.
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          KAY_HARDROCK: ${{ secrets.KAY_HARDROCK }}                   # Kay's Hard Rock bucket (manual figure) for the balances email
          PROPHETX_ACCESS_KEY: ${{ secrets.PROPHETX_ACCESS_KEY }}   # used only to read ProphetX prices
          PROPHETX_SECRET_KEY: ${{ secrets.PROPHETX_SECRET_KEY }}
          NOVIG_TRADE_KEY_ID: ${{ secrets.NOVIG_TRADE_KEY_ID }}     # ID only: reads the auto-place subaccount's positions
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}               # positions only (GET); no order code in the dry run
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          PMUS_KEY_ID: ${{ secrets.PMUS_KEY_ID }}                   # positions only (GET)
          PMUS_SECRET_KEY: ${{ secrets.PMUS_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}                     # phone alert when a bet is held (positions unreadable)
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}                 # Nov 3: Pinnacle price check at each live order (read only)
          LINE_VALUE_PIN_READ: ${{ github.event.inputs.pin_read }}  # Nov 12: manual dispatch only; empty on schedule
          LINE_VALUE_MODE: ${{ vars.LINE_VALUE_MODE }}              # Nov 12: 'live' activates the replacement; unset/'shadow' = legacy decides
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}               # Nov 4: Lane 2 reads Pinnacle's LIMIT at decision time (dry run only)
          EXEC_UNIT: "300"
          # LIVE phase 1 (Oct 26): real ProphetX orders only when the repo VARIABLE EXEC_LIVE is "on"
          EXEC_LIVE: ${{ vars.EXEC_LIVE }}
          # Nov 12 (Peter): the Novig submission hold was readable by novig-snapshot-check and
          # novig-dispatch-check but NEVER reached the executor, so setting the variable would have
          # had no effect here - book_live.NOVIG_SUBMIT would still default off. Wired with an
          # explicit 'off' default so the hold stays on if the variable is unset or removed.
          # Activation is: set the repo VARIABLE to "on". Verify in a completed run's env block,
          # which prints variables in the clear.
          EXEC_NOVIG_SUBMIT: ${{ vars.EXEC_NOVIG_SUBMIT || 'off' }}
          # Nov 3 (Peter "ok build"): Lane 3 board NBA totals places money only when this is "on" (and EXEC_LIVE is on)
          # The `|| 'off'` is the default for an ABSENT variable, never a statement of the lane's state - the repo
          # variable decides and Peter flips it. The code reads .strip().lower() == "on", so "true"/"yes"/"1" read
          # as off. Do not record a lane's live state in a comment here: a Nov 4 note saying Lane 3 was paper-only
          # outlived the switch being turned on and was read as current fact on Nov 11. Read the variable instead.
          EXEC_BOARD_LIVE: ${{ vars.EXEC_BOARD_LIVE || 'off' }}
          # Nov 11 (Peter "NO MORE PAPER"): R1 live lane (non-Top-25 college, ProphetX-priced spreads + unders). Places money only
          # when this repo VARIABLE is "on" (and EXEC_LIVE is on). Own $200 unit; own daily risk limit and play cap below.
          EXEC_R1_LIVE: ${{ vars.EXEC_R1_LIVE || 'off' }}
          EXEC_R1_DAILY_RISK: ${{ vars.EXEC_R1_DAILY_RISK || '2000' }}
          EXEC_R1_MAX_PLAYS: ${{ vars.EXEC_R1_MAX_PLAYS || '10' }}
          # Nov 11 (Peter: "Make it 2000", "And global 3000"). Neither of these was passed here before,
          # so both ran on their code default and there was no repo variable to flip. Now both are
          # explicit AND the code defaults match, so the two can never disagree.
          # EXEC_BOARD_DAILY_RISK: Lane 3's own risk cap, ON TOP of the global stop.
          # EXEC_DAILY_STOP: the GLOBAL worst-case LOSS stop, not an exposure cap - px_live tests
          # (today's ProphetX result - money at risk on every other book) <= -EXEC_DAILY_STOP.
          EXEC_BOARD_DAILY_RISK: ${{ vars.EXEC_BOARD_DAILY_RISK || '2000' }}
          EXEC_DAILY_STOP: ${{ vars.EXEC_DAILY_STOP || '3000' }}
          PX_QTY_MEANS: ${{ vars.PX_QTY_MEANS }}                   # "stake" (default) or "to_win" - set from the $1 test
          PROPHETX_TRADE_ACCESS_KEY: ${{ secrets.PROPHETX_TRADE_ACCESS_KEY }}
          PROPHETX_TRADE_SECRET_KEY: ${{ secrets.PROPHETX_TRADE_SECRET_KEY }}
        # Nov 1: a wake that arrives while another executor run is busy can be dropped by GitHub's queue (the 6:00 AM
        # Celtics/Magic alert waited 10 min for the timer). So after each pass, if alerts.json got a newer commit
        # than this pass started with, pull it and run again (same job = never two at once).
        #
        # Nov 11 (Peter "GO"): 3 catch-up passes -> 1. MEASURED: a 9:32 ET sharp alert (Lakers @ Bucks Under 230.5)
        # waited because the 9:20 run was still doing catch-up passes at 9:38, and the wakes it fired at 9:25, 9:27
        # and 9:30 were all dropped by the concurrency queue. Passes take 6-15 min, so 1 + 3 passes reaches the
        # 30-minute ceiling and swallows every wake that lands inside it.
        #
        # The catch-up loop and the wake do the SAME JOB, and at 3 passes they fight: the loop exists to catch
        # alerts that arrive mid-run, but it makes the run long enough to drop the wake that would have caught
        # them sooner. One catch-up pass halves the worst case while keeping a net for the case the wake dispatch
        # itself fails - which sharp-monitor.yml already falls back on the 10-minute timer for.
        #
        # Concurrency is UNCHANGED: cancel-in-progress stays false, so no run is ever cut off mid-order.
        #
        # Nov 11 (Peter "MAKE SURE IF IT FAILS IT RUNS AGAIN"): a failed pass now retries ONCE in the
        # same job instead of waiting up to 10 minutes for the next timer.
        #
        # The 90-SECOND WAIT IS LOAD-BEARING, not politeness. A pass can fail AFTER placing an order,
        # and the duplicate guards all read Gmail: already_handled() greps the play's pid, LIVEKEYS
        # comes from the ledger, and the write-ahead intent row is what proves an order may exist.
        # Gmail needs a moment to index those, so an instant retry could read "never placed" and
        # place the same bet twice. 90s gives the registry time to be readable; if the intent row is
        # there the retry is blocked by LIVEKEYS, and if the journal failed the latch refuses outright.
        #
        # BOUNDED AT TWO EXECUTIONS either way - a catch-up pass OR a retry, never both - so the job
        # cannot walk into the 30-minute ceiling and be killed mid-order, which is the failure this
        # repo already learned the hard way.
        run: |
          # Nov 11 (Peter): every pass is timestamped and its duration printed, so wall time is
          # attributable to passes without inferring it. The 17:10 run was 17m52s with only ~392s
          # in PERF; counting "Verdict plays seen" showed ONE pass, which ruled out the catch-up
          # loop as the explanation and sent the instrumentation into the per-play path instead.
          # Seconds only - safe for the public log.
          pass_n=0
          run_pass() {
            pass_n=$((pass_n + 1))
            local t0=$(date -u +%s)
            echo "PASS $pass_n START $(date -u +%H:%M:%SZ)"
            local rc=0
            python -u executor.py || rc=$?
            local t1=$(date -u +%s)
            echo "PASS $pass_n END $(date -u +%H:%M:%SZ) duration $((t1 - t0))s exit $rc"
            return $rc
          }
          job_t0=$(date -u +%s)
          if run_pass; then
            for i in 1; do
              git fetch -q origin main || break
              if git diff --quiet HEAD origin/main -- alerts.json; then break; fi
              echo "newer alerts.json landed during the run: pass $((i + 1))"
              git reset -q --hard origin/main
              run_pass || true
            done
          else
            echo "pass 1 FAILED - waiting 90s for the Gmail registry to be readable, then retrying once"
            sleep 90
            git fetch -q origin main && git reset -q --hard origin/main || true
            run_pass || true
          fi
          echo "JOB TOTAL $(( $(date -u +%s) - job_t0 ))s across $pass_n pass(es)"
