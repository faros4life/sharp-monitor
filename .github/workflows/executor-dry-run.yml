name: executor-dry-run

on:
  schedule:
    - cron: "7-59/10 * * * *"   # backup timer; cron-job.org is the real one
  workflow_dispatch:

concurrency:
  group: executor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Dry run (no order code; emails only; counts in this log)
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          NOVIG_READ_KEY_ID: ${{ secrets.NOVIG_READ_KEY_ID }}       # read-only: positions for duplicate/conflict checks
          NOVIG_READ_KEY_PEM: ${{ secrets.NOVIG_READ_KEY_PEM }}
          PROPHETX_ACCESS_KEY: ${{ secrets.PROPHETX_ACCESS_KEY }}   # used only to read ProphetX prices
          PROPHETX_SECRET_KEY: ${{ secrets.PROPHETX_SECRET_KEY }}
          EXEC_UNIT: "200"
        run: python -u executor.py
