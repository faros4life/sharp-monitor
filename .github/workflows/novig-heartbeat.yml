name: novig-heartbeat

# Peter, Nov 11 (item 3). Is the home PC's Novig positions snapshot still advancing?
#
# The Windows Scheduled Task restarts a DEAD runner. It cannot see a runner that is alive and
# silently not reporting - a wedged job, a revoked token, a network that is up but cannot reach
# GitHub. From here that is visible: snapshot_utc stops moving.
#
# Read-only for trading: no bet, no order, no rule change, no Novig API call, no OddsPapi credit.
# It reads the same snapshot by the same route the executor uses, so a read that fails here would
# fail there too. Pushes ONCE on going stale and ONCE on recovery - never on every run - using a
# one-line state file kept on an orphan 'heartbeat' branch, the same pattern ncaab-openers uses.
# Prints minutes and counts only: no positions, no dollars, nothing account-identifying.

on:
  # Nov 12 (Peter, "yes" to fixing the other stale workflows). MEASURED: GitHub fired the hourly
  # cron below THREE times in 24 hours - 18:19:21Z, 09:49:57Z, 01:53:59Z, roughly every 8 hours -
  # so a heartbeat meant to notice a wedged home runner within 35 minutes was itself checking
  # every eight. Every firing SUCCEEDED; the job is fine and the timer is not. Of the last 100
  # runs in this repo 87 are workflow_dispatch and 5 are schedule, as executor-dry-run's own
  # comment records: cron-job.org is the real timer here, and it drives the executor.
  #
  # So this rides the executor's completions, which arrive every ~5 minutes, and the cron stays
  # on as a backup timer. Same fix as fill-reports (02920d7d2), which went from a 1.4-hour gap
  # to firing within two minutes of each executor pass.
  workflow_run:
    workflows: ["executor-dry-run"]
    types: [completed]
  schedule:
    - cron: "17 * * * *"      # hourly, off the hour so it does not queue behind the :00 crowd
  workflow_dispatch:
    inputs:
      stale_min:
        description: "Minutes before the snapshot counts as stale (default 35)"
        default: "35"
        required: false

permissions:
  contents: write             # only to keep heartbeat/novig_state.json on the heartbeat branch

concurrency:
  group: novig-heartbeat
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Previous state, if the branch exists yet. A missing branch is the normal first run.
      - name: Load previous state
        run: |
          mkdir -p heartbeat
          git fetch -q --depth=1 origin heartbeat 2>/dev/null || exit 0
          git show FETCH_HEAD:heartbeat/novig_state.json > heartbeat/novig_state.json 2>/dev/null || true

      # DELIBERATELY NOT RATE-GATED. A gate that skipped most executor completions would still
      # conclude the run SUCCESS, and the health page reads last-success - so a skipped run
      # would report "heartbeat ran 2m ago" when nothing was checked. A monitor that lies about
      # having looked is worse than one that looks too often.
      #
      # Running every pass is cheap: novig_heartbeat.py reads the runner's snapshot FILE from
      # GitHub (vnd.github.raw, a GitHub token), not the Novig API - no venue call, no OddsPapi
      # credit - and the state branch is force-pushed as a fresh single-commit orphan, so it
      # does not grow. And it is strictly better: this check has a 35-minute staleness
      # threshold, which an hourly cron could never meet and an 8-hourly one made meaningless.
      - name: Novig snapshot heartbeat
        env:
          NOVIG_SNAPSHOT_TOKEN: ${{ secrets.NOVIG_SNAPSHOT_TOKEN }}
          NOVIG_READ_TOKEN: ${{ secrets.NOVIG_READ_TOKEN }}   # narrow read credential; preferred over the broad one once it exists
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOVIG_STALE_MIN: ${{ inputs.stale_min || '35' }}
        run: python -u novig_heartbeat.py

      # Orphan branch holding ONLY the state file, so main is never touched by this job.
      - name: Remember whether it was already alerted
        if: always()
        run: |
          [ -f heartbeat/novig_state.json ] || exit 0
          cp heartbeat/novig_state.json "$RUNNER_TEMP/novig_state.json"
          git config user.name "novig-heartbeat"
          git config user.email "novig-heartbeat@users.noreply.github.com"
          git checkout -q --orphan hb-tmp
          git rm -rq --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p heartbeat
          cp "$RUNNER_TEMP/novig_state.json" heartbeat/novig_state.json
          git add -A heartbeat
          git commit -q -m "novig heartbeat state"
          git push -q -f origin hb-tmp:heartbeat
