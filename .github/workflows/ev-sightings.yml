name: ev-sightings

# PAPER STUDY, MEASUREMENT ONLY (Oct 27, 2026): logs EV sightings on the four exchanges and grades them.
# Never places orders, never sends notifications, never writes main: data lives on the ev-study branch.
# Amendment A1 (Oct 27): adds the Pinnacle move-watch leg inside the same run (no extra workflow).
# ============================================================================================
# STUDY CLOSED 2026-11-13 (Peter: "Approved. Disable ev-sightings now."). COLLECTION STOPPED.
#
# It answered both of its questions, negative, with large samples and with pre-registered
# buckets locked 2026-10-31 BEFORE any forward data was read:
#
#   1. Does exchange "EV" predict closing value?  NO.
#      A cross-book >=2c: 9774 graded, CLV -1.62c, 5085-4689, -300.58u (-3.1% ROI)
#      A qualifying >=3c: 2197 graded, CLV -3.10c, -173.62u (-7.9%) - the TIGHTER filter did worse
#      B Pinnacle >=3%EV:  175 graded, CLV -0.80c, 74-101, -17.98u (-10.3%)
#      Pre-registered J1 J2 J3 J4: all four negative.
#
#   2. Do paper resting orders work?  NO - clear adverse selection, every row, both books:
#      MK novig fair-1c      2742 posted, 117 filled (4.3%)  FILL -0.57c vs UNFILLED +1.58c
#      MK novig fair-2c      2731 posted,  48 filled (1.8%)  FILL -0.08c vs UNFILLED +2.52c
#      MK prophetx fair-1c   5922 posted, 281 filled (4.7%)  FILL -1.08c vs UNFILLED +1.10c
#      MK prophetx fair-2c   5882 posted, 103 filled (1.8%)  FILL -0.57c vs UNFILLED +2.04c
#      Orders fill precisely when the market has moved against them. The study's own README
#      names this test: "if fills do much worse than unfilled, that is adverse selection."
#
#   Every gate in the study's own README reads "criteria not met".
#
# COST IT WAS STILL SPENDING: ~551 GitHub runner-minutes/day (9% of this repo) and 641 OddsPapi
# credits/day - 27% of the 2401/day total burn on the 100K/month plan.
#
# NOTHING IS DELETED. The ev-study branch, ev_sightings.json (38MB of observations), the README
# carrying every table above, and ev_sightings.py all stay exactly as they are. Only collection
# stops. No other workflow, and nothing in live execution, is touched by this change.
#
# The cron is removed here AND the workflow is disabled through the Actions API, because
# cron-job.org fires this by workflow_dispatch independently of any cron in this file, so removing
# the cron alone would NOT have stopped it. Disabling the workflow through the Actions API would
# have, but that endpoint needs actions=write and this session's token is refused with 403. So the
# JOB ITSELF is gated instead: it runs only when dispatched with reopen=REOPEN. An ungated
# dispatch SKIPS the job, and a skipped job starts no runner at all - zero compute, zero OddsPapi
# credits, nothing written. The external timer can keep firing harmlessly until its entry is
# removed, which is the one remaining step and is Peter's to do on cron-job.org.
#
# TO REOPEN: dispatch with reopen=REOPEN for a single run, or restore the cron line below for
# continuous collection. The script and all history are untouched, so it resumes, never restarts.
# ============================================================================================
on:
  # schedule: REMOVED 2026-11-13, study closed. Was: cron "7-59/10 * * * *" (every 10 minutes).
  workflow_dispatch:
    inputs:
      reopen:
        description: "Type REOPEN to run the CLOSED study once. Any other value does nothing."
        required: false
        default: ""

concurrency:
  group: ev-sightings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    # STUDY CLOSED 2026-11-13. This gate is what actually stops collection: the cron above is
    # gone, but cron-job.org dispatches this workflow on its own timer, and that entry still
    # exists. An ungated dispatch now SKIPS this job - GitHub starts no runner for a skipped job,
    # so it costs no compute, spends no OddsPapi credits and writes nothing to the ev-study
    # branch. Only an explicit reopen=REOPEN runs the study.
    if: ${{ github.event.inputs.reopen == 'REOPEN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12   # A1: each run keeps polling Pinnacle ~7 min after the full read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load study data from the ev-study branch
        run: |
          mkdir -p ev-study
          if git fetch -q origin ev-study 2>/dev/null; then
            git show origin/ev-study:ev_sightings.json > ev-study/ev_sightings.json 2>/dev/null || rm -f ev-study/ev_sightings.json
          fi
      - name: Log sightings (read-only)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}               # free /events + Pinnacle read; floor keeps sharp-monitor credits
          PROPHETX_ACCESS_KEY: ${{ secrets.PROPHETX_ACCESS_KEY }}  # read-only: login + markets, never orders
          PROPHETX_SECRET_KEY: ${{ secrets.PROPHETX_SECRET_KEY }}
          EV_BOOKS: ${{ vars.EV_BOOKS }}   # optional off switch, e.g. kalshi,novig,polymarket_us (drops ProphetX)
        run: python -u ev_sightings.py
      - name: Save to the ev-study branch (never main)
        if: always()
        run: |
          [ -f ev-study/ev_sightings.json ] || exit 0
          rm -rf "$RUNNER_TEMP/out" && mkdir -p "$RUNNER_TEMP/out" && cp ev-study/* "$RUNNER_TEMP/out/"
          git config user.name "ev-sightings"
          git config user.email "ev-sightings@users.noreply.github.com"
          for i in 1 2 3; do
            if git fetch -q origin ev-study 2>/dev/null; then
              git checkout -q -f -B ev-study origin/ev-study
            else
              git checkout -q -f --orphan ev-study
              git rm -rq --cached . >/dev/null 2>&1 || true
            fi
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp "$RUNNER_TEMP/out/"* .
            git add -A
            git diff --cached --quiet && break
            git commit -q -m "EV sightings update"
            git push -q origin ev-study && break
            sleep 5
          done
