name: line-value-audit

# READ-ONLY. Manual dispatch only. Reads the Gmail ledger and prints COUNTS to the log. It does not import or
# invoke order execution, send email, write to the repo, or print any game, line, price, stake or key.
# Detail stays in the private mailbox (the ledger rows already live there).
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days of executor emails to read"
        default: "30"
      email:
        description: "1 = also email the per-fill CSV to the private inbox (never printed in the log)"
        default: "0"
      prefixes:
        description: "Subject prefixes, | separated (Bets LIVE: holds the real fills; add Bets dry run: for would-fills)"
        default: "Bets LIVE:"

permissions:
  contents: read

concurrency:
  group: line-value-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit (counts only)
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          AUDIT_DAYS: ${{ github.event.inputs.days }}
          AUDIT_PREFIXES: ${{ github.event.inputs.prefixes }}
          AUDIT_EMAIL: ${{ github.event.inputs.email }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python3 line_value_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: line-value-audit
          path: summary/line_value_audit_fills.csv
          retention-days: 7
