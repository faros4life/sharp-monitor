name: pmus-activity

on:
  schedule:
    - cron: "41 12 * * 1"   # Mondays ~8:41 AM ET, right after the Novig weekly
  workflow_dispatch:
    inputs:
      order_id:
        description: "Optional: look up ONE order by id (status only, no email)"
        required: false
        type: string
      days:
        description: "How many days back"
        default: "30"
      mode:
        description: "registry_unknowns = read back Polymarket US bot orders since 12 Nov with no fill record (status only, no ids, no email)"
        required: false
        default: ""

permissions:
  contents: write    # registry_unknowns mode only: commits reporting/pm_links.enc (encrypted, no amounts)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Email Polymarket US activity (read-only; counts only in this log)
        env:
          PMUS_KEY_ID: ${{ secrets.PMUS_KEY_ID }}
          PMUS_SECRET_KEY: ${{ secrets.PMUS_SECRET_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DAYS: ${{ github.event.inputs.days || '30' }}
          PMUS_ORDER_ID: ${{ github.event.inputs.order_id }}
          MODE: ${{ github.event.inputs.mode }}
          TRACKER_PASSPHRASE: ${{ github.event.inputs.mode == 'registry_unknowns' && secrets.TRACKER_PASSPHRASE || '' }}
          REGISTRY_TOKEN: ${{ github.event.inputs.mode == 'registry_unknowns' && secrets.REGISTRY_TOKEN || '' }}   # read-only registry, only in this mode
        run: python -u pmus_activity.py
      - name: Commit the encrypted order->market links (registry_unknowns mode only)
        if: github.event.inputs.mode == 'registry_unknowns'
        run: |
          [ -f reporting/pm_links.enc ] || { echo "no links file"; exit 0; }
          python - <<'PY'
          import json
          b = json.load(open("reporting/pm_links.enc"))
          assert set(b) == {"s", "i", "c", "n"}, "FAIL: links file is not ciphertext"
          PY
          git status --porcelain --untracked-files=all -- . ':!reporting/pm_links.enc' > "$RUNNER_TEMP/d"
          if [ -s "$RUNNER_TEMP/d" ]; then echo "FAIL: unexpected changes"; cat "$RUNNER_TEMP/d"; exit 1; fi
          git config user.name "pmus-activity"; git config user.email "pmus-activity@users.noreply.github.com"
          git add reporting/pm_links.enc
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -q -m "pm links (encrypted)"
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:main && { echo committed; exit 0; }
            cp reporting/pm_links.enc "$RUNNER_TEMP/l.enc"
            git fetch -q --depth=1 origin main && git reset -q --hard FETCH_HEAD || exit 1
            mkdir -p reporting && cp "$RUNNER_TEMP/l.enc" reporting/pm_links.enc
            git add reporting/pm_links.enc && git commit -q -m "pm links (encrypted)"; sleep 3
          done
          echo "FAIL: push"; exit 1
